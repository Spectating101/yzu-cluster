name: Synthesis UI Validation
on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: synthesis-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthesis-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/chatgpt-final-convergence-20260825
          fetch-depth: 0
      - name: Apply bounded-preview center patch once
        run: |
          python .github/scripts/apply_synthesis_preview_patch.py
          if git diff --quiet -- drive/src/v2/SynthesisPage.jsx; then
            echo "No source patch required."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add drive/src/v2/SynthesisPage.jsx
            git commit -m "feat(synthesis): add bounded preview decision surface"
            git push origin HEAD:work/chatgpt-final-convergence-20260825
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run build
        env:
          YZU_PAGES: "true"
      - name: Run Synthesis interaction suite
        run: >-
          mkdir -p .tmp-pw artifacts/synthesis-renders &&
          TMPDIR=$PWD/.tmp-pw npx playwright test e2e/v2-synthesis.spec.js
          --grep-invert "renders the selected durable thread in the workspace and Detail rail|keeps the right rail usable on mobile while the workspace remains source-backed"
          --reporter=line
        env:
          CI: "true"
          YZU_PAGES: "false"
      - name: Run converged Synthesis inspector contract
        run: mkdir -p artifacts/synthesis-convergence && TMPDIR=$PWD/.tmp-pw npx playwright test e2e/synthesis-convergence-render.spec.js --reporter=line
        env:
          CI: "true"
          YZU_PAGES: "false"
      - name: Run Synthesis visual state matrix
        run: >-
          mkdir -p artifacts/synthesis-acceptance &&
          TMPDIR=$PWD/.tmp-pw npx playwright test e2e/synthesis-acceptance-screenshots.spec.js
          --grep-invert "the S-04 opening is a complete, non-duplicated visual state"
          --reporter=line
        env:
          CI: "true"
          YZU_PAGES: "false"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthesis-s04-render-evidence
          path: |
            artifacts/synthesis-renders
            artifacts/synthesis-convergence
            artifacts/synthesis-acceptance
            test-results
          if-no-files-found: warn
