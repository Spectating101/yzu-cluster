name: Runtime contracts

on:
  pull_request:
    paths:
      - "drive/src/v2/**"
      - "e2e/v2-platform-convergence.spec.js"
      - "scripts/yzu_cluster/**"
      - "tests/test_yzu_interop_*.py"
      - "docs/product/CLUSTER_RUNTIME_INTEROP_CONTRACT.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/runtime-contract.yml"
  push:
    branches:
      - "agent/**"
    paths:
      - "drive/src/v2/**"
      - "e2e/v2-platform-convergence.spec.js"
      - "scripts/yzu_cluster/**"
      - "tests/test_yzu_interop_*.py"
      - "docs/product/CLUSTER_RUNTIME_INTEROP_CONTRACT.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/runtime-contract.yml"

permissions:
  contents: read

concurrency:
  group: runtime-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify backend orchestration contracts
        run: python -m unittest discover -s tests -p "test_yzu_interop_*.py" -v

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify frontend runtime contracts
        run: npm run test:runtime-contract

      - name: Verify candidate UI contracts
        run: npm run test:candidate-key

      - name: Build Research Drive
        run: npm run build

      - name: Install convergence browser
        run: npx playwright install chromium --with-deps

      - name: Verify integrated Research Drive convergence
        run: >-
          mkdir -p .tmp-pw artifacts/platform-convergence &&
          TMPDIR=$PWD/.tmp-pw CI=true YZU_PAGES=false npx playwright test
          e2e/v2-platform-convergence.spec.js --workers=1 --reporter=line

      - name: Preserve convergence renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-drive-platform-convergence
          path: |
            artifacts/platform-convergence
            test-results
          if-no-files-found: warn
