name: Discover capability convergence one shot

on:
  push:
    branches:
      - polish/discover-visual-freeze-20260827

permissions:
  contents: write

jobs:
  converge:
    if: contains(github.event.head_commit.message, '[discover-capability-converge]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/discover-visual-freeze-20260827
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Rehydrate workflow baseline for idempotent patch
        run: >-
          git show 6260232d1cc3668660c7fab2d47397d2a1fd90bb^:.github/workflows/discover-visual-validation.yml
          > .github/workflows/discover-visual-validation.yml
      - name: Apply guarded patch
        run: |
          python3 .github/scripts/discover_capability_converge.py
          python3 .github/scripts/discover_capability_compat.py
          python3 .github/scripts/discover_capability_finish.py
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: Unit and build contracts
        run: |
          npm run test:candidate-key
          npm run build
      - name: Discover evidence behavior
        run: |
          mkdir -p .tmp-pw
          TMPDIR=$PWD/.tmp-pw CI=true YZU_PAGES=false npx playwright test e2e/v2-discover-evidence.spec.js --reporter=line
          TMPDIR=$PWD/.tmp-pw CI=true YZU_PAGES=false npx playwright test e2e/v2-discover.spec.js --grep "filter and sort controls remain fully reachable" --workers=1 --reporter=line
      - name: Discover rendered capability matrix
        run: |
          mkdir -p .tmp-pw artifacts/discover-convergence
          TMPDIR=$PWD/.tmp-pw CI=true YZU_PAGES=false npx playwright test e2e/discover-visual-convergence.spec.js --reporter=line
      - name: Commit converged frontend
        run: |
          git config user.name "discover-convergence-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drive/src/v2/main.jsx \
                  drive/src/v2/DiscoverEvidenceBrief.jsx \
                  drive/src/v2/BrowsePage.jsx \
                  drive/src/v2/InspectorRail.jsx \
                  drive/src/v2/ResearchSituationRail.jsx \
                  drive/src/v2/DiscoverIntentWorkspace.jsx \
                  drive/src/v2/DiscoverCoveragePanel.jsx \
                  drive/src/v2/discoverDecisionCapacity.js \
                  drive/src/v2/discover-visual-freeze.css \
                  e2e/fixtures/v2MockApi.js \
                  e2e/v2-discover-evidence.spec.js \
                  e2e/discover-visual-convergence.spec.js
          git commit -m "feat(discover): surface evidence investigation and procurement capacity"
          git push origin HEAD:polish/discover-visual-freeze-20260827
