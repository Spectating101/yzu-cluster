name: Research Drive live review

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/live-review-main.yml"
      - "playwright.live-review.config.js"
      - "e2e/live-review.spec.js"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: research-drive-live-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Live Discover screenshot capture
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      YZU_DESK_URL: https://previous.easycamp.tech
    steps:
      - name: Checkout capture branch
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Confirm hosted Chrome
        run: google-chrome --version

      - name: Confirm review endpoint
        run: curl --fail --show-error --location --max-time 30 "$YZU_DESK_URL/" >/dev/null

      - name: Capture live Discover
        run: npm run test:live-review

      - name: Upload live-review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-drive-live-review-${{ github.run_id }}
          path: |
            artifacts/live-review/
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
