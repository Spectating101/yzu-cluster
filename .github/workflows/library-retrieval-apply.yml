name: Library retrieval apply

on:
  push:
    branches:
      - hardening/library-retrieval-excellence-20260828

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[retrieval-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply retrieval integration
        run: python scripts/apply_library_retrieval.py
      - name: Run retrieval unit contract
        run: node --test drive/src/v2/librarySearch.test.js
      - name: Install dependencies
        run: npm ci
      - name: Build Research Drive
        run: npm run build
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: Run Library journey
        run: npx playwright test e2e/v2-library.spec.js --reporter=line
      - name: Commit applied slice
        run: |
          git config user.name spectating101
          git config user.email s1133958@mail.yzu.edu.tw
          git add drive/src/v2/LibraryPage.jsx drive/src/v2/LibraryEvidenceEstate.jsx drive/src/v2/App.jsx drive/src/v2/AskRail.jsx drive/src/v2/library-evidence-rigor.css e2e/v2-library.spec.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(library): make held-evidence retrieval explainable [retrieval-applied]'
          git push origin HEAD:hardening/library-retrieval-excellence-20260828
