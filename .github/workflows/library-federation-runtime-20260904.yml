name: Library federation runtime 2026-09-04

on:
  push:
    branches:
      - audit/library-federation-runtime-20260904
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Apply federation runtime product patch
        run: |
          python3 scripts/_apply_library_federation_runtime.py
          python3 scripts/_fix_library_federation_runtime.py
          if ! git diff --quiet -- drive/src/v2 e2e/fixtures/v2MockApi.js e2e/library-federation-runtime.spec.js; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add drive/src/v2 e2e/fixtures/v2MockApi.js e2e/library-federation-runtime.spec.js
            git commit -m "feat(library): harden provider-backed federation runtime"
            git push origin HEAD:audit/library-federation-runtime-20260904
          fi
      - run: npm ci
      - run: npx playwright install chromium
      - name: Federation and evidence identity contracts
        run: >-
          node --test
          drive/src/v2/libraryFederationRuntime.test.js
          drive/src/v2/libraryEvidenceGraph.test.js
          drive/src/v2/libraryLocations.test.js
          drive/src/v2/libraryHoldings.test.js
          drive/src/v2/libraryFreshness.test.js
      - name: Production build
        run: npm run build
        env:
          YZU_PAGES: "true"
      - name: Federation workflow and Library regressions
        run: >-
          mkdir -p .tmp-pw && TMPDIR=$PWD/.tmp-pw npx playwright test
          e2e/library-federation-runtime.spec.js
          e2e/library-folder-workflow.spec.js
          e2e/library-location-disabled.spec.js
          e2e/library-pagination-continuity.spec.js
          e2e/library-holdings.spec.js
          e2e/library-freshness.spec.js
          --reporter=dot
        env:
          CI: "true"
          YZU_PAGES: "false"
      - name: Upload federation runtime proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-federation-runtime-20260904
          path: |
            artifacts/library-federation-runtime
            artifacts/library-folder-workflow
            artifacts/library-location-disabled
            artifacts/library-holdings
            artifacts/library-freshness
            test-results
          if-no-files-found: warn
          retention-days: 14
