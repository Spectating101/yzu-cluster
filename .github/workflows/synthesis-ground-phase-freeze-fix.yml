name: Synthesis Ground phase freeze fix

on:
  push:
    branches:
      - hardening/synthesis-analytical-verification-20260826
    paths:
      - tools/_tmp_synthesis_ground_phase_gate.py
      - .github/workflows/synthesis-ground-phase-freeze-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/synthesis-analytical-verification-20260826
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply guarded Ground-only discovery patch
        run: python tools/_tmp_synthesis_ground_phase_gate.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prove recommended opening stays decision-first while unmapped Ground still rediscovers evidence
        env:
          CI: '1'
          YZU_PAGES: 'false'
        run: |
          npx playwright test e2e/synthesis-convergence-render.spec.js --grep "keeps the current recommended opening complete after explicit selection" --workers=1 --retries=0 --timeout=60000 --reporter=line
          npx playwright test e2e/synthesis-revisit-evidence.spec.js --workers=1 --retries=0 --timeout=30000 --reporter=line
          npx playwright test e2e/v2-synthesis.spec.js --grep "researcher reviews held evidence|finalized output exposes the exact frozen method|creates a durable thread quietly" --workers=1 --retries=0 --timeout=60000 --reporter=line
      - name: Commit only the verified product fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drive/src/v2/SynthesisPage.jsx
          git commit -m "fix(synthesis): keep evidence discovery in Ground phase"
          git push origin HEAD:hardening/synthesis-analytical-verification-20260826
