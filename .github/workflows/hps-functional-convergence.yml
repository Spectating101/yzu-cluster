name: HPS functional convergence

on:
  push:
    branches:
      - hardening/hps-functional-convergence-20260827
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hps-functional-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  converge:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[hps-functional]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/hps-functional-convergence-20260827
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply HPS functional convergence patch
        run: |
          python .github/scripts/hps_functional_patch_prepare.py
          python .github/scripts/hps_functional_convergence.py
          python .github/scripts/hps_functional_convergence_fix.py
          python .github/scripts/hps_home_handoff_debug.py

      - name: Check patch integrity
        run: git diff --check

      - name: Verify HPS policy and continuity contracts
        run: >-
          node --test
          drive/src/v2/settingsStore.test.js
          drive/src/v2/hpsHomeContinuity.test.js

      - name: Build Research Drive
        run: npm run build

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Diagnose Home Synthesis handoff
        id: home_diag
        run: |
          set +e
          npx playwright test \
            e2e/hps-functional-convergence.spec.js \
            --project=chromium \
            --workers=1 \
            --grep "Home chooses reviewable Synthesis" 2>&1 | tee /tmp/hps-home-diagnostic.log
          status=${PIPESTATUS[0]}
          {
            echo "status=${status}"
            grep -E "HPS_HOME_(POST_CLICK|PAGEERROR)" /tmp/hps-home-diagnostic.log || true
            grep -E "Expected:|Received:|pageErrors|synthesis-studio|Timeout" /tmp/hps-home-diagnostic.log | tail -20 || true
          } > .hps-home-diagnostic-result
          exit ${status}
        env:
          CI: "true"
          YZU_PAGES: "false"

      - name: Persist Home diagnostic result
        if: always()
        run: |
          git config user.name "hps-diagnostic-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --hard HEAD
          if [ ! -f .hps-home-diagnostic-result ]; then
            echo "status=diagnostic-step-did-not-produce-result" > .hps-home-diagnostic-result
          fi
          git add .hps-home-diagnostic-result
          if ! git diff --cached --quiet; then
            git commit -m "chore(hps): record Home synthesis diagnostic"
            git push origin HEAD:hardening/hps-functional-convergence-20260827
          fi
