name: Discover SERP contract patch

on:
  push:
    branches:
      - prototype/discover-utility-workbench-20260902
    paths:
      - ".github/workflows/discover-serp-contract-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/discover-utility-workbench-20260902
      - name: Patch proven Discover visual contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('e2e/discover-reconvergence-visual.spec.js')
          s = p.read_text()
          s = s.replace('await expect(page.getByRole("heading", { name: "Discover" })).toBeVisible();', 'await expect(page.getByRole("heading", { name: "Discover", exact: true })).toBeVisible();', 1)
          old = '      const fieldBox = await page.getByTestId("discover-evidence-field").boundingBox();\n      const resultsBox = await page.getByTestId("discover-ranked-results").boundingBox();\n      expect(fieldBox).not.toBeNull();\n      expect(resultsBox).not.toBeNull();\n      expect(resultsBox.y - (fieldBox.y + fieldBox.height)).toBeLessThan(38);'
          new = '      const resultsBox = await page.getByTestId("discover-ranked-results").boundingBox();\n      expect(resultsBox).not.toBeNull();\n      if (viewport.width >= 1680) {\n        await expect(page.getByTestId("discover-evidence-field")).toBeHidden();\n        await expect(page.getByTestId("discover-interpreting")).toBeVisible();\n        await expect(page.locator(".rd-v2-discover-frozen-controls")).toBeVisible();\n        const firstResultBox = await page.getByTestId("discover-ranked-results").locator(".rd-v2-discover-candidate").first().boundingBox();\n        expect(firstResultBox).not.toBeNull();\n        expect(firstResultBox.y).toBeLessThan(430);\n      } else {\n        const fieldBox = await page.getByTestId("discover-evidence-field").boundingBox();\n        expect(fieldBox).not.toBeNull();\n        expect(resultsBox.y - (fieldBox.y + fieldBox.height)).toBeLessThan(38);\n      }'
          assert old in s
          s = s.replace(old, new, 1)
          old = '      await page.getByRole("button", { name: /DataCite live catalogue/i }).click();\n      await expect(page.getByText(/DataCite live catalogue/i).first()).toBeVisible();'
          new = '      const dataciteRow = page.getByTestId("discover-ranked-results").getByRole("button", { name: /DataCite live catalogue/i });\n      await dataciteRow.click();\n      await expect(dataciteRow).toHaveAttribute("aria-pressed", "true");'
          assert old in s
          s = s.replace(old, new, 1)
          old = '    await expect(page.getByText(/DataCite live catalogue/i).first()).toBeVisible();'
          new = '    const dataciteRow = page.getByTestId("discover-ranked-results").getByRole("button", { name: /DataCite live catalogue/i });\n    await expect(dataciteRow).toHaveAttribute("aria-pressed", "true");'
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit contract update
        run: |
          git config user.name research-drive-bot
          git config user.email actions@users.noreply.github.com
          git add e2e/discover-reconvergence-visual.spec.js
          git commit -m "test(discover): certify SERP workstation allocation"
          git push origin HEAD:prototype/discover-utility-workbench-20260902
