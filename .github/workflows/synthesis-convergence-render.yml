name: Synthesis convergence render

on:
  push:
    branches:
      - work/chatgpt-final-convergence-20260825
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run build
      - run: mkdir -p .tmp-pw artifacts/synthesis-convergence && TMPDIR=$PWD/.tmp-pw CI=true YZU_PAGES=false npx playwright test e2e/synthesis-convergence-render.spec.js --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthesis-convergence-pngs
          path: |
            artifacts/synthesis-convergence
            test-results
          if-no-files-found: warn
