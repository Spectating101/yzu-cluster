name: Synthesis convergence render

# Hardening branch pushes intentionally exercise the complete rendered and
# interaction contract before any merge or deployment. A visually convincing
# frame is not enough for freeze: the researcher must be able to move through
# grounding, review, approval, execution, and reversible excursions without
# losing the durable thread or being shown fabricated state.
on:
  push:
    branches:
      - work/chatgpt-final-convergence-20260825
      - hardening/synthesis-analytical-verification-20260826
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded Synthesis structural freeze cleanup
        if: github.event_name == 'push' && github.ref_name == 'hardening/synthesis-analytical-verification-20260826'
        shell: bash
        run: |
          python scripts/synthesis_freeze_structural_patch.py
          git diff --check
          if git diff --quiet; then
            echo 'Structural cleanup already applied.'
          else
            git config user.name 'synthesis-freeze-bot'
            git config user.email 'synthesis-freeze-bot@users.noreply.github.com'
            git add drive/src/v2/SynthesisPage.jsx drive/src/v2/api.js drive/src/v2/JoinDecisionPanel.jsx
            git commit -m 'refactor(synthesis): make freeze interactions first-class'
            git push origin HEAD:hardening/synthesis-analytical-verification-20260826
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify Synthesis join-ranking freeze contract
        run: node --test drive/src/v2/joinCandidates.test.js
      - run: npx playwright install chromium --with-deps
      - run: npm run build
      - name: Exercise Synthesis researcher workflow
        run: >-
          mkdir -p .tmp-pw artifacts/synthesis-renders &&
          TMPDIR=$PWD/.tmp-pw CI=true YZU_PAGES=false npx playwright test e2e/v2-synthesis.spec.js
          --grep-invert "renders the selected durable thread in the workspace and Detail rail|keeps the right rail usable on mobile while the workspace remains source-backed"
          --reporter=line
      - name: Render converged Synthesis frames
        run: mkdir -p .tmp-pw artifacts/synthesis-convergence && TMPDIR=$PWD/.tmp-pw CI=true YZU_PAGES=false npx playwright test e2e/synthesis-convergence-render.spec.js --reporter=line
      - name: Render desktop Synthesis workflow states
        run: >-
          mkdir -p artifacts/synthesis-acceptance &&
          TMPDIR=$PWD/.tmp-pw CI=true YZU_PAGES=false npx playwright test e2e/synthesis-acceptance-screenshots.spec.js
          --grep " at desktop 1440px"
          --reporter=line
      - name: Render workstation Synthesis workflow states
        run: >-
          mkdir -p artifacts/synthesis-acceptance &&
          TMPDIR=$PWD/.tmp-pw CI=true YZU_PAGES=false npx playwright test e2e/synthesis-acceptance-screenshots.spec.js
          --grep " at workstation 1920px"
          --reporter=line
      - name: Render production-scale Synthesis analytical states
        run: >-
          mkdir -p artifacts/synthesis-scale &&
          TMPDIR=$PWD/.tmp-pw CI=true YZU_PAGES=false npx playwright test e2e/synthesis-production-scale-render.spec.js
          --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthesis-convergence-pngs
          path: |
            artifacts/synthesis-renders
            artifacts/synthesis-convergence
            artifacts/synthesis-acceptance
            artifacts/synthesis-scale
            test-results
          if-no-files-found: warn
