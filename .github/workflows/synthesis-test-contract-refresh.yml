name: Synthesis test contract refresh

on:
  push:
    branches:
      - hardening/synthesis-analytical-verification-20260826
    paths:
      - .github/workflows/synthesis-test-contract-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/synthesis-analytical-verification-20260826
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh exact interaction expectations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('e2e/v2-synthesis.spec.js')
          text = path.read_text(encoding='utf-8')

          old_label = 'name: "Start project in Ask"'
          count = text.count(old_label)
          if count < 1:
              raise SystemExit('expected at least one obsolete Start project in Ask locator')
          text = text.replace(old_label, 'name: "Create construction"')

          old = '''    const next = page.getByRole("region", { name: "What happens next" });
              const proposal = page.getByTestId("synthesis-proposal-state");
              await expect(next).toContainText("Review checkpoint");
              await expect(next).toContainText("nothing has run");
              await expect(next.getByRole("button", { name: "Review proposal" })).toHaveCount(0);
              await expect(page.locator("aside.rd-v2-rail")).toContainText("recorded for review");
              await expect(page.locator("aside.rd-v2-rail")).not.toContainText("No construction has been recommended yet");
              await expect(proposal).toContainText("Aggregate held weekly panel");'''
          new = '''    const proposal = page.getByTestId("synthesis-proposal-state");
              // Proposal review is now the authoritative decision surface itself. The
              // redundant navigation/checkpoint card must stay absent.
              await expect(page.getByRole("region", { name: "What happens next" })).toHaveCount(0);
              await expect(page.locator("aside.rd-v2-rail")).toContainText("recorded for review");
              await expect(page.locator("aside.rd-v2-rail")).not.toContainText("No construction has been recommended yet");
              await expect(proposal).toBeVisible();
              await expect(proposal.getByRole("button", { name: "Accept & test method" })).toBeVisible();
              await expect(proposal).toContainText("Aggregate held weekly panel");'''
          if text.count(old) != 1:
              raise SystemExit(f'proposal checkpoint opening: expected one exact match, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old_layout = '''    const nextBox = await next.boundingBox();
              const proposalBox = await proposal.boundingBox();
              expect(nextBox && proposalBox && proposalBox.y > nextBox.y).toBeTruthy();
              expect((proposalBox?.y || Infinity) - ((nextBox?.y || 0) + (nextBox?.height || 0))).toBeLessThan(40);
              await capture(page, "02-proposal-review-desktop");'''
          new_layout = '''    await expect(proposal).toBeInViewport();
              await capture(page, "02-proposal-review-desktop");'''
          if text.count(old_layout) != 1:
              raise SystemExit(f'proposal checkpoint layout: expected one exact match, found {text.count(old_layout)}')
          text = text.replace(old_layout, new_layout, 1)

          path.write_text(text, encoding='utf-8')
          print(f'refreshed {count} obsolete create locators and direct proposal-review expectations')
          PY
          git diff --check
          git diff -- e2e/v2-synthesis.spec.js
          git config user.name 'synthesis-contract-bot'
          git config user.email 'synthesis-contract-bot@users.noreply.github.com'
          git add e2e/v2-synthesis.spec.js
          git commit -m 'test(synthesis): align browser contract with direct review flow'
          git push origin HEAD:hardening/synthesis-analytical-verification-20260826
