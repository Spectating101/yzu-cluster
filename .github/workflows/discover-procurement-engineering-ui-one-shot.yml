name: Discover procurement engineering UI one shot

on:
  push:
    branches:
      - polish/discover-visual-freeze-20260827

permissions:
  contents: write

jobs:
  harden:
    if: contains(github.event.head_commit.message, '[discover-engineering-ui]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/discover-visual-freeze-20260827
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Apply procurement engineering UI
        run: python .github/scripts/discover_procurement_engineering_ui.py
      - name: Prove normalized backend engineering truth
        run: node --test drive/src/v2/discoverIntent.test.js
      - name: Build
        run: npm run build
      - name: Prove Discover evidence and procurement engineering flow
        run: >-
          mkdir -p .tmp-pw &&
          TMPDIR=$PWD/.tmp-pw CI=true YZU_PAGES=false npx playwright test
          e2e/v2-discover-evidence.spec.js --workers=1 --reporter=line
      - name: Preserve adversarial authority boundaries
        run: >-
          mkdir -p .tmp-pw &&
          TMPDIR=$PWD/.tmp-pw CI=true YZU_PAGES=false npx playwright test
          e2e/v2-discover-adversarial.spec.js --workers=1 --reporter=line
      - name: Render convergence states
        run: >-
          mkdir -p .tmp-pw artifacts/discover-convergence &&
          TMPDIR=$PWD/.tmp-pw CI=true YZU_PAGES=false npx playwright test
          e2e/discover-visual-convergence.spec.js --workers=1 --reporter=line
      - name: Commit verified UI
        run: |
          git config user.name "discover-hardening-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            drive/src/v2/DiscoverIntentWorkspace.jsx \
            drive/src/v2/discover-visual-freeze.css \
            e2e/fixtures/v2MockApi.js \
            e2e/v2-discover-evidence.spec.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "verified UI already committed"
            exit 0
          fi
          git commit -m "feat(discover): surface compiled procurement engineering"
          git push origin HEAD:polish/discover-visual-freeze-20260827
