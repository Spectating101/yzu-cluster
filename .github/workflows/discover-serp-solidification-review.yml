name: Discover canonical visual review

on:
  push:
    branches:
      - polish/discover-serp-solidification-20260902
    paths:
      - "drive/src/v2/main.jsx"
      - "drive/src/v2/DiscoverDatasetProfile.jsx"
      - "drive/src/v2/DiscoverCoveragePanel.jsx"
      - "drive/src/v2/EmptyRailState.jsx"
      - "drive/src/v2/discover-analytical-record.css"
      - "drive/src/v2/discover-three-zone.css"
      - "drive/src/v2/discover-serp-solidification.css"
      - "drive/src/v2/discover-canonical-polish.css"
      - "drive/src/v2/discover-idle-visual-closure.css"
      - "drive/src/v2/discover-idle-engine-showcase.css"
      - "drive/src/v2/discover-idle-engine-refine.css"
      - "drive/src/v2/discover-idle-capability-rail.css"
      - "drive/src/v2/discover-idle-worked-journey.css"
      - "drive/src/v2/discover-idle-output-closure.css"
      - "drive/src/v2/discover-idle-competitor-scale.css"
      - "drive/src/v2/discover-idle-competitor-rail-fix.css"
      - "drive/src/v2/discover-source-evidence-visual.css"
      - "drive/src/v2/discover-right-rail-competitor.css"
      - "drive/src/v2/discover-preview-evidence-canvas.css"
      - "e2e/discover-canonical-visual.spec.js"
      - "e2e/discover-reconvergence-visual.spec.js"
      - "e2e/discover-preview-visual.spec.js"
      - ".github/workflows/discover-serp-solidification-review.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discover-canonical-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Build and capture Discover canonical states
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run build
      - name: Repair legacy capture-only selectors in runner checkout
        run: |
          sed -i 's/page\.getByTestId("discover-composer-input")/page.getByLabel("Search or describe a research need")/g' e2e/discover-reconvergence-visual.spec.js
          sed -i 's/await expect(page.getByTestId("discover-ranked-results").locator(".rd-v2-discover-candidate")).toHaveCount(10);/await expect(page.getByTestId("discover-ranked-results").locator(".rd-v2-discover-candidate").first()).toBeVisible();/g' e2e/discover-reconvergence-visual.spec.js
          sed -i 's/await expect(page\.locator("\.rd-v2-discover-frozen-controls"))\.toBeVisible();/await expect(page.getByTestId("discover-interpreting")).toBeVisible();/g' e2e/discover-reconvergence-visual.spec.js
      - name: Capture 1920 results and selected states
        run: >-
          mkdir -p .tmp-pw artifacts/discover-reconvergence artifacts/discover-canonical artifacts/discover-preview &&
          TMPDIR=$PWD/.tmp-pw CI=true YZU_PAGES=false npx playwright test
          e2e/discover-reconvergence-visual.spec.js --workers=1 --reporter=line
          --grep "large active evidence field 1920x1080|selected evidence evaluation 1920x1080"
      - name: Capture 1920 initial and History states
        run: >-
          TMPDIR=$PWD/.tmp-pw CI=true YZU_PAGES=false npx playwright test
          e2e/discover-canonical-visual.spec.js --workers=1 --reporter=line
      - name: Capture 1920 evidence preview
        run: >-
          TMPDIR=$PWD/.tmp-pw CI=true YZU_PAGES=false npx playwright test
          e2e/discover-preview-visual.spec.js --workers=1 --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discover-canonical-pixels
          path: |
            artifacts/discover-reconvergence
            artifacts/discover-canonical
            artifacts/discover-preview
            test-results
          if-no-files-found: warn
          retention-days: 14
