name: Visual hardening acceptance

on:
  push:
    branches:
      - "agent/research-drive-visual-hardening-20260831"
    paths:
      - "drive/src/v2/**"
      - "e2e/visual-hardening.spec.js"
      - "e2e/fixtures/v2MockApi.js"
      - ".github/workflows/visual-hardening.yml"
  pull_request:
    paths:
      - "drive/src/v2/**"
      - "e2e/visual-hardening.spec.js"
      - "e2e/fixtures/v2MockApi.js"
      - ".github/workflows/visual-hardening.yml"

permissions:
  contents: read

concurrency:
  group: visual-hardening-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Research Drive
        run: npm run build

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Run visual hardening acceptance
        run: >-
          mkdir -p .tmp-pw artifacts/visual-hardening &&
          TMPDIR=$PWD/.tmp-pw CI=true YZU_PAGES=false npx playwright test
          e2e/visual-hardening.spec.js --workers=1 --reporter=line

      - name: Preserve visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-drive-visual-hardening
          path: |
            artifacts/visual-hardening
            test-results
          if-no-files-found: warn
