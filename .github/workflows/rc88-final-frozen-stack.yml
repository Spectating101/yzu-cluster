name: RC88 final frozen Runtime proof

on:
  push:
    branches:
      - "verify/rc88-final-frozen-stack-20260829"

permissions:
  contents: read

jobs:
  final-frozen-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Apply frozen Discover candidate in disposable checkout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          browse = Path("drive/src/v2/BrowsePage.jsx")
          text = browse.read_text()
          old = '''          Review acquisition route
        </button>'''
          new = '''          Add to collection
        </button>'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one ranked-row action label, found {text.count(old)}")
          browse.write_text(text.replace(old, new))

          for path, expected in [
              (Path("e2e/v2-discover.spec.js"), 2),
              (Path("e2e/v2-discover-evidence.spec.js"), 2),
          ]:
              text = path.read_text()
              old = '"Review acquisition route"'
              new = '"Add to collection"'
              if text.count(old) != expected:
                  raise SystemExit(f"{path}: expected {expected} stale row-action selectors, found {text.count(old)}")
              path.write_text(text.replace(old, new))

          css = Path("drive/src/v2/v2.css")
          text = css.read_text()
          old_counts = '''.rd-v2-discover-frozen-counts {
  display: flex;'''
          new_counts = '''.rd-v2-discover-frozen-counts {
  position: relative;
  display: flex;'''
          if text.count(old_counts) != 1:
              raise SystemExit(f"unexpected frozen-counts declaration count: {text.count(old_counts)}")
          text = text.replace(old_counts, new_counts)

          old_evidence = '''.rd-v2-discover-library-evidence {
  position: relative;
}'''
          new_evidence = '''.rd-v2-discover-library-evidence {
  position: static;
}'''
          if text.count(old_evidence) != 1:
              raise SystemExit(f"unexpected library-evidence declaration count: {text.count(old_evidence)}")
          text = text.replace(old_evidence, new_evidence)

          old_popover = '''  width: min(520px, 72vw);
  max-width: calc(100vw - 32px);'''
          new_popover = '''  width: min(520px, 100%);
  max-width: 100%;'''
          if text.count(old_popover) != 1:
              raise SystemExit(f"unexpected popover width declaration count: {text.count(old_popover)}")
          text = text.replace(old_popover, new_popover)
          css.write_text(text)
          PY
          git diff --check
          git diff --stat

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install chromium --with-deps

      - name: Full mocked Research Drive surface
        run: CI=true YZU_PAGES=false npm run test:v2-mock

      - name: Integrated platform convergence
        run: >-
          mkdir -p .tmp-pw artifacts/platform-convergence &&
          TMPDIR=$PWD/.tmp-pw CI=true YZU_PAGES=false npx playwright test
          e2e/v2-platform-convergence.spec.js --workers=1 --reporter=line

      - name: Frozen authority and lifecycle stack
        run: >-
          CI=true YZU_PAGES=false npm run test:freeze &&
          CI=true YZU_PAGES=false npm run test:lifecycle-states &&
          CI=true YZU_PAGES=false npm run test:synthesis-states

      - name: Discover evidence regression suite
        run: >-
          mkdir -p .tmp-pw &&
          TMPDIR=$PWD/.tmp-pw CI=true YZU_PAGES=false npx playwright test
          e2e/v2-discover-evidence.spec.js --workers=1 --reporter=line

      - name: Preserve proof context
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc88-final-frozen-stack
          path: |
            artifacts/platform-convergence
            test-results
          if-no-files-found: warn
