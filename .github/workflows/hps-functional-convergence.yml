name: HPS functional convergence

on:
  push:
    branches:
      - hardening/hps-functional-convergence-20260827
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hps-functional-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  converge:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[hps-functional]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/hps-functional-convergence-20260827
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply HPS functional convergence patch
        run: |
          python .github/scripts/hps_functional_patch_prepare.py
          python .github/scripts/hps_functional_convergence.py
          python .github/scripts/hps_functional_convergence_fix.py

      - name: Check patch integrity
        run: git diff --check

      - name: Verify HPS policy and continuity contracts
        run: >-
          node --test
          drive/src/v2/settingsStore.test.js
          drive/src/v2/hpsHomeContinuity.test.js

      - name: Build Research Drive
        run: npm run build

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Prove HPS cross-platform consequences
        run: >-
          npx playwright test
          e2e/hps-functional-convergence.spec.js
          e2e/hps-inner-containment.spec.js
          e2e/v2-library.spec.js
          --project=chromium
          --workers=1
        env:
          CI: "true"
          YZU_PAGES: "false"

      - name: Commit only verified functional integration
        run: |
          git config user.name "hps-convergence-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            drive/src/v2/homeIteration10.js \
            drive/src/v2/HomePage.jsx \
            drive/src/v2/App.jsx \
            drive/src/v2/RailPanels.jsx
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No convergence changes to commit"
            exit 0
          fi
          git commit -m "feat(hps): close platform continuity and policy loops"
          git push origin HEAD:hardening/hps-functional-convergence-20260827
