name: Profile Settings reopen render

on:
  push:
    branches:
      - polish/profile-settings-reopen-20260902
  workflow_dispatch:

concurrency:
  group: profile-settings-reopen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Build Research Drive
        run: npm run build

      - name: Render reopened Profile and Settings
        run: npx playwright test e2e/profile-settings-reopen-render.spec.js --reporter=line
        env:
          CI: "true"
          YZU_PAGES: "false"

      - name: Upload Profile Settings renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-settings-reopen-renders
          path: |
            artifacts/profile-settings-reopen
            test-results
          if-no-files-found: warn
          retention-days: 14
