name: Synthesis final evidence-flow edge patch

on:
  push:
    branches:
      - hardening/synthesis-analytical-verification-20260826
    paths:
      - .github/workflows/synthesis-final-edge-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/synthesis-analytical-verification-20260826
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact evidence-flow edge fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          page = 'drive/src/v2/SynthesisPage.jsx'
          test = 'e2e/v2-synthesis.spec.js'

          replace_once(
              page,
              '  mappingEvidence = false,\n  reasoningPending = false,',
              '  mappingEvidence = false,\n  evidenceProposalAvailable = false,\n  reasoningPending = false,',
              'WhatHappensNext evidence proposal argument',
          )
          replace_once(
              page,
              '{needsEvidence ? (',
              '{needsEvidence && !mappingEvidence && !evidenceProposalAvailable ? (',
              'retry-only held evidence condition',
          )
          replace_once(
              page,
              'disabled={mappingEvidence || !onFindEvidence}',
              'disabled={!onFindEvidence}',
              'retry button disabled state',
          )
          replace_once(
              page,
              'onClick={() => onFindEvidence?.()}\n            >',
              'onClick={() => onFindEvidence?.()}\n              title="Retry held-evidence discovery"\n            >',
              'retry button title',
          )
          replace_once(
              page,
              '{mappingEvidence ? "Finding held evidence" : "Find held evidence"}',
              'Retry held evidence',
              'retry button label',
          )
          replace_once(
              page,
              'disabled={reasoningPending || !reasoningAvailable || (hasRecommendation ? !onAccept : !onStartReasoning)}',
              'disabled={needsEvidence || reasoningPending || !reasoningAvailable || (hasRecommendation ? !onAccept : !onStartReasoning)}',
              'reasoning waits for mapped evidence',
          )
          replace_once(
              page,
              'title={!reasoningAvailable ? reasoningStatus : undefined}',
              'title={needsEvidence ? "Review and map held evidence before method reasoning." : !reasoningAvailable ? reasoningStatus : undefined}',
              'reasoning disabled explanation',
          )
          replace_once(
              page,
              '                    mappingEvidence={mappingEvidence}\n                    reasoningPending={reasoningPending}',
              '                    mappingEvidence={mappingEvidence}\n                    evidenceProposalAvailable={Boolean(evidenceProposal)}\n                    reasoningPending={reasoningPending}',
              'pass evidence proposal availability',
          )

          replace_once(
              test,
              '    await expect(next.getByRole("button", { name: "Find held evidence" })).toHaveCount(0);',
              '    await expect(next.getByRole("button", { name: /held evidence/i })).toHaveCount(0);\n    await expect(next.getByRole("button", { name: "Start method reasoning" })).toBeDisabled();',
              'pin automatic evidence controls',
          )
          replace_once(
              test,
              '    await expect(page.getByTestId("synthesis-evidence-proposal")).toHaveCount(0);\n    await capture(page, "02c-held-evidence-mapped-desktop");',
              '    await expect(page.getByTestId("synthesis-evidence-proposal")).toHaveCount(0);\n    await expect(next.getByRole("button", { name: "Start method reasoning" })).toBeEnabled();\n    await capture(page, "02c-held-evidence-mapped-desktop");',
              'pin reasoning unlock after mapping',
          )
          replace_once(
              test,
              '    await expect(page.locator("aside.rd-v2-rail")).toContainText("recorded for review");',
              '    await expect(page.locator("aside.rd-v2-rail")).toContainText("Proposal needs review");\n    await expect(page.locator("aside.rd-v2-rail")).toContainText("Accept or reject this exact revision-bound proposal");',
              'align proposal rail authority wording',
          )
          PY
          git diff --check
          git diff -- drive/src/v2/SynthesisPage.jsx e2e/v2-synthesis.spec.js
          git config user.name 'synthesis-edge-bot'
          git config user.email 'synthesis-edge-bot@users.noreply.github.com'
          git rm .github/workflows/synthesis-final-edge-patch.yml
          git add drive/src/v2/SynthesisPage.jsx e2e/v2-synthesis.spec.js
          git commit -m 'fix(synthesis): remove evidence-flow ceremony and races'
          git push origin HEAD:hardening/synthesis-analytical-verification-20260826
