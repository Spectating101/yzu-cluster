name: Library retrieval apply

on:
  push:
    branches:
      - hardening/library-retrieval-excellence-20260828

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[retrieval-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply retrieval integration
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'pattern not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # LibraryPage: use the full held estate for evidence-aware search, keep ordinary browsing unchanged.
          replace_once(
              'drive/src/v2/LibraryPage.jsx',
              'import { resolveLibrarySelection } from "@/v2/librarySelection";\n',
              'import { resolveLibrarySelection } from "@/v2/librarySelection";\nimport { buildLibrarySearchAskPrompt, rankLibraryHoldings } from "@/v2/librarySearch";\n',
          )
          replace_once(
              'drive/src/v2/LibraryPage.jsx',
              '    if (sortBy === "updated") {\n      const delta = itemUpdatedTime(b) - itemUpdatedTime(a);\n      if (delta) return delta;\n    }\n',
              '    if (sortBy === "relevance") {\n      const delta = Number(itemDataset(b).search_match?.score || 0) - Number(itemDataset(a).search_match?.score || 0);\n      if (delta) return delta;\n    }\n    if (sortBy === "updated") {\n      const delta = itemUpdatedTime(b) - itemUpdatedTime(a);\n      if (delta) return delta;\n    }\n',
          )
          replace_once(
              'drive/src/v2/LibraryPage.jsx',
              '  onAskDataset,\n  searchQuery = "",\n',
              '  onAskDataset,\n  onAskSearch,\n  searchQuery = "",\n',
          )
          replace_once(
              'drive/src/v2/LibraryPage.jsx',
              '  const [sortBy, setSortBy] = useState("name");\n  const [filterMode, setFilterMode] = useState("all");\n  const [newMenuOpen, setNewMenuOpen] = useState(false);\n\n  const vaultDatasets = useMemo(\n    () => (datasets || []).filter((row) => !isOpsNoiseDataset(row)),\n    [datasets],\n  );\n',
              '''  const [sortBy, setSortBy] = useState("name");
  const [filterMode, setFilterMode] = useState("all");
  const [newMenuOpen, setNewMenuOpen] = useState(false);
  const searchActive = Boolean(String(searchQuery || "").trim());

  const librarySearchNav = useMemo(() => {
    const byDataset = new Map();
    const shelfById = new Map((shelves || []).map((shelf) => [String(shelf.id || ""), shelf]));
    for (const lane of partitions || []) {
      const shelf = shelfById.get(String(lane.shelf_id || ""));
      const nav = [
        shelf?.label,
        shelf?.blurb,
        lane.professor_label,
        lane.subtitle,
        lane.name,
        lane.professor_blurb,
        lane.scope,
        lane.partition_id,
        lane.detail?.partition_id,
      ]
        .filter(Boolean)
        .join(" ");
      const ids = lane.detail?.registry_dataset_ids || lane.registry_dataset_ids || [];
      for (const id of ids) {
        const key = String(id || "");
        if (!key) continue;
        byDataset.set(key, `${byDataset.get(key) || ""} ${nav}`.trim());
      }
    }
    return byDataset;
  }, [partitions, shelves]);

  const allHeldDatasets = useMemo(
    () => (selectionHoldings || datasets || []).filter((row) => !isOpsNoiseDataset(row)),
    [datasets, selectionHoldings],
  );
  const rankedSearchDatasets = useMemo(
    () => (searchActive ? rankLibraryHoldings(allHeldDatasets, searchQuery, librarySearchNav) : []),
    [allHeldDatasets, librarySearchNav, searchActive, searchQuery],
  );
  const vaultDatasets = useMemo(
    () => (searchActive ? rankedSearchDatasets : (datasets || []).filter((row) => !isOpsNoiseDataset(row))),
    [datasets, rankedSearchDatasets, searchActive],
  );

  useEffect(() => {
    if (searchActive) {
      setSortBy((current) => (current === "name" ? "relevance" : current));
    } else {
      setSortBy((current) => (current === "relevance" ? "name" : current));
    }
  }, [searchActive]);
''',
          )
          replace_once(
              'drive/src/v2/LibraryPage.jsx',
              '  const items = useMemo(() => listFolderChildren(tree, folderId), [tree, folderId]);\n  const searchActive = Boolean(String(searchQuery || "").trim());\n',
              '  const items = useMemo(() => listFolderChildren(tree, folderId), [tree, folderId]);\n',
          )
          replace_once(
              'drive/src/v2/LibraryPage.jsx',
              '  const handleProcureBranch = useCallback(() => {\n    setNewMenuOpen(false);\n    onStartProcure?.(branchObject);\n  }, [branchObject, onStartProcure]);\n\n  return (\n',
              '''  const handleProcureBranch = useCallback(() => {
    setNewMenuOpen(false);
    onStartProcure?.(branchObject);
  }, [branchObject, onStartProcure]);

  const askCurrentSearch = useCallback(() => {
    const query = String(searchQuery || "").trim();
    if (!query || !onAskSearch) return;
    onClearSelection?.();
    onAskSearch(buildLibrarySearchAskPrompt(query, branchDatasetRows));
  }, [branchDatasetRows, onAskSearch, onClearSelection, searchQuery]);

  return (
''',
          )
          replace_once(
              'drive/src/v2/LibraryPage.jsx',
              '                placeholder="Search this library…"\n',
              '                placeholder="Search title, field, source, coverage…"\n',
          )
          replace_once(
              'drive/src/v2/LibraryPage.jsx',
              '            </label>\n            <Chip active={sortBy === "name"} onClick={() => setSortBy("name")}>\n',
              '''            </label>
            {searchActive && onAskSearch ? (
              <button
                type="button"
                className="rd-v2-btn sm rd-v2-library-search-ask"
                data-testid="library-search-ask"
                onClick={askCurrentSearch}
              >
                Ask Library
              </button>
            ) : null}
            {searchActive ? (
              <Chip active={sortBy === "relevance"} onClick={() => setSortBy("relevance")}>
                Relevance
              </Chip>
            ) : null}
            <Chip active={sortBy === "name"} onClick={() => setSortBy("name")}>
''',
          )
          replace_once(
              'drive/src/v2/LibraryPage.jsx',
              '              onSelectDataset={onSelectDataset}\n            />\n',
              '              onSelectDataset={onSelectDataset}\n              searchQuery={searchQuery}\n            />\n',
          )

          # Evidence ledger: show why a search result matched, in one compact line.
          replace_once(
              'drive/src/v2/LibraryEvidenceEstate.jsx',
              '  onSelectDataset,\n}) {\n',
              '  onSelectDataset,\n  searchQuery = "",\n}) {\n',
          )
          replace_once(
              'drive/src/v2/LibraryEvidenceEstate.jsx',
              '                    <strong>{displayName(row)}</strong>\n                    <em>{descriptionLabel(row)}</em>\n',
              '''                    <strong>{displayName(row)}</strong>
                    <em>{descriptionLabel(row)}</em>
                    {searchQuery && row.search_match?.reasons?.length ? (
                      <span className="rd-v2-library-match" data-testid="library-search-match">
                        <b>Matched</b>
                        {row.search_match.reasons.slice(0, 3).map((reason) => (
                          <span key={`${reason.kind}-${reason.value}`}>
                            {reason.label} · {reason.value}
                          </span>
                        ))}
                      </span>
                    ) : null}
''',
          )

          # App: let Library explicitly hand the current search to Ask without coupling search typing to LLM calls.
          replace_once(
              'drive/src/v2/App.jsx',
              '          onAskDataset={canUseAsk ? askAboutLibraryDataset : undefined}\n          onRefresh={refreshBackend}\n',
              '          onAskDataset={canUseAsk ? askAboutLibraryDataset : undefined}\n          onAskSearch={canUseAsk ? queueLibraryAsk : undefined}\n          onRefresh={refreshBackend}\n',
          )

          # Ask rail: Library is an evidence-finding context, not generic procurement chat.
          replace_once(
              'drive/src/v2/AskRail.jsx',
              '  const isDiscover = mainTab === DISCOVER_TAB;\n',
              '  const isDiscover = mainTab === DISCOVER_TAB;\n  const isLibrary = mainTab === "library";\n',
          )
          replace_once(
              'drive/src/v2/AskRail.jsx',
              '          : "Procurement chat";\n',
              '          : isLibrary\n            ? "Ask · Library"\n            : "Procurement chat";\n',
          )
          replace_once(
              'drive/src/v2/AskRail.jsx',
              '            : ctxParts.length\n              ? ctxParts.join(" · ")\n              : "Select a dataset for grounded answers";\n',
              '''            : isLibrary
              ? searchQuery
                ? `Search context · ${searchQuery}`
                : "Context · held research evidence"
              : ctxParts.length
                ? ctxParts.join(" · ")
                : "Select a dataset for grounded answers";
''',
          )
          replace_once(
              'drive/src/v2/AskRail.jsx',
              '          ) : isSynthesis ? (\n',
              '''          ) : isLibrary ? (
            <div className="rd-v2-ask-placeholder" data-testid="library-ask-guidance">
              <p>
                Ask what evidence you already hold, why a result matches, how holdings compare, or what is genuinely missing. Library answers must keep held evidence separate from Discover candidates.
              </p>
              <div className="rd-v2-chips-row rd-v2-ask-chips">
                {[
                  searchQuery ? `Explain the best matches for ${searchQuery}` : "What evidence do I have?",
                  "Which held assets overlap?",
                  "What evidence is still missing?",
                ].map((p) => (
                  <button key={p} type="button" className="rd-v2-chip clickable" disabled={busy} onClick={() => send(p)}>
                    {String(p).length > 48 ? `${String(p).slice(0, 45)}…` : p}
                  </button>
                ))}
              </div>
            </div>
          ) : isSynthesis ? (
''',
          )

          # Compact search evidence; no new cards or vertical chrome.
          css = Path('drive/src/v2/library-evidence-rigor.css')
          css_text = css.read_text(encoding='utf-8')
          marker = '/* Library retrieval evidence */'
          if marker not in css_text:
              css.write_text(css_text + '''\n\n/* Library retrieval evidence */
.rd-v2-library-match {
  display: flex;
  min-width: 0;
  gap: 6px;
  align-items: center;
  margin-top: 3px;
  font-size: 10.5px;
  line-height: 1.25;
  color: var(--text-muted, #667085);
  overflow: hidden;
}

.rd-v2-library-match > b {
  flex: 0 0 auto;
  font-weight: 700;
  color: var(--text-secondary, #475467);
}

.rd-v2-library-match > span {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.rd-v2-library-match > span + span::before {
  content: "·";
  margin-right: 6px;
  color: var(--text-subtle, #98a2b3);
}

.rd-v2-library-search-ask {
  flex: 0 0 auto;
  white-space: nowrap;
}
''', encoding='utf-8')

          # Existing journey should now prove explainability, not just filtering.
          replace_once(
              'e2e/v2-library.spec.js',
              '    await expect(row).toBeVisible();\n    await row.click();\n',
              '    await expect(row).toBeVisible();\n    await expect(row).toContainText("Matched");\n    await expect(row.getByTestId("library-search-match")).toContainText(/name|topic|collection/i);\n    await expect(page.getByTestId("library-search-ask")).toBeVisible();\n    await row.click();\n',
          )
      - name: Run retrieval unit contract
        run: node --test drive/src/v2/librarySearch.test.js
      - name: Install dependencies
        run: npm ci
      - name: Build Research Drive
        run: npm run build
      - name: Run Library journey
        run: npx playwright install chromium >/dev/null 2>&1 && npx playwright test e2e/v2-library.spec.js --reporter=line
      - name: Commit applied slice
        run: |
          git config user.name spectating101
          git config user.email s1133958@mail.yzu.edu.tw
          git add drive/src/v2/LibraryPage.jsx drive/src/v2/LibraryEvidenceEstate.jsx drive/src/v2/App.jsx drive/src/v2/AskRail.jsx drive/src/v2/library-evidence-rigor.css e2e/v2-library.spec.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(library): make held-evidence retrieval explainable [retrieval-applied]'
          git push origin HEAD:hardening/library-retrieval-excellence-20260828
