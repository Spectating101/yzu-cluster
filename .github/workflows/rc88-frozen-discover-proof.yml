name: RC88 frozen Discover proof

on:
  push:
    branches:
      - "verify/rc88-frozen-discover-20260829"

permissions:
  contents: write

jobs:
  frozen-discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Apply candidate frozen-authority repair in disposable checkout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          browse = Path("drive/src/v2/BrowsePage.jsx")
          text = browse.read_text()
          old = '''          Review acquisition route
        </button>'''
          new = '''          Add to collection
        </button>'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one ranked-row action label, found {text.count(old)}")
          browse.write_text(text.replace(old, new))

          evidence = Path("e2e/v2-discover-evidence.spec.js")
          text = evidence.read_text()
          old = 'getByRole("button", { name: "Review acquisition route" })'
          new = 'getByRole("button", { name: "Add to collection" })'
          if text.count(old) != 2:
              raise SystemExit(f"expected two ranked-row selectors, found {text.count(old)}")
          evidence.write_text(text.replace(old, new))

          css = Path("drive/src/v2/v2.css")
          text = css.read_text()
          old_counts = '''.rd-v2-discover-frozen-counts {
  display: flex;'''
          new_counts = '''.rd-v2-discover-frozen-counts {
  position: relative;
  display: flex;'''
          if text.count(old_counts) != 1:
              raise SystemExit(f"unexpected frozen-counts declaration count: {text.count(old_counts)}")
          text = text.replace(old_counts, new_counts)

          old_evidence = '''.rd-v2-discover-library-evidence {
  position: relative;
}'''
          new_evidence = '''.rd-v2-discover-library-evidence {
  position: static;
}'''
          if text.count(old_evidence) != 1:
              raise SystemExit(f"unexpected library-evidence declaration count: {text.count(old_evidence)}")
          text = text.replace(old_evidence, new_evidence)

          old_popover = '''  width: min(520px, 72vw);
  max-width: calc(100vw - 32px);'''
          new_popover = '''  width: min(520px, 100%);
  max-width: 100%;'''
          if text.count(old_popover) != 1:
              raise SystemExit(f"unexpected popover width declaration count: {text.count(old_popover)}")
          text = text.replace(old_popover, new_popover)
          css.write_text(text)
          PY
          git diff --check
          git diff -- drive/src/v2/BrowsePage.jsx drive/src/v2/v2.css e2e/v2-discover-evidence.spec.js

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install chromium --with-deps

      - name: Frozen composition authority
        run: CI=true YZU_PAGES=false npm run test:freeze

      - name: Discover procurement and convergence regression set
        shell: bash
        run: |
          mkdir -p .tmp-pw artifacts/platform-convergence
          TMPDIR=$PWD/.tmp-pw CI=true YZU_PAGES=false npx playwright test \
            e2e/v2-discover-evidence.spec.js \
            e2e/v2-platform-convergence.spec.js \
            --workers=1 --reporter=line

      - name: Commit proven candidate tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rc88-frozen-discover-proof.yml
          git add drive/src/v2/BrowsePage.jsx drive/src/v2/v2.css e2e/v2-discover-evidence.spec.js
          git diff --cached --check
          git commit -m "fix(discover): restore frozen row action and evidence sheet bounds"
          git push
