name: Library file-browser ergonomics apply

on:
  push:
    branches:
      - hardening/library-retrieval-excellence-20260828

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[filebrowser-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply file-browser interaction pass
        run: |
          python scripts/apply_library_filebrowser_ergonomics.py
          python scripts/apply_library_filebrowser_styles.py
          python scripts/fix_library_retrieval_ergonomics.py
      - name: Run retrieval unit contract
        run: node --test drive/src/v2/librarySearch.test.js
      - name: Install dependencies
        run: npm ci
      - name: Build Research Drive
        run: npm run build
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: Run Library workflow and retrieval states
        run: npx playwright test e2e/v2-library.spec.js e2e/library-retrieval-excellence-render.spec.js --reporter=line
        env:
          CI: 'true'
          YZU_PAGES: 'false'
      - name: Commit applied ergonomics
        run: |
          git config user.name spectating101
          git config user.email s1133958@mail.yzu.edu.tw
          git add drive/src/v2/LibraryPage.jsx drive/src/v2/App.jsx drive/src/v2/library-evidence-rigor.css drive/src/v2/librarySearch.js drive/src/v2/librarySearch.test.js e2e/v2-library.spec.js .github/workflows/library-convergence-render.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(library): converge on file-browser ergonomics [filebrowser-applied]'
          git push origin HEAD:hardening/library-retrieval-excellence-20260828

# Stable convergence trigger: 2026-08-28
