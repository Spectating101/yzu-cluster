name: Discover three-zone workstation patch
on:
  push:
    branches: [prototype/discover-utility-workbench-20260902]
    paths: [.github/workflows/discover-three-zone-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/discover-utility-workbench-20260902
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('drive/src/v2/BrowsePage.jsx')
          s=p.read_text()
          start=s.index('              <div className="rd-v2-discover-query-tools">')
          end=s.index('              {assessmentActive ? (', start)
          replacement='''              <div className="rd-v2-discover-centre-toolbar" aria-label="Result controls">\n                <div>\n                  <strong>{plural(centreRows.length, "data option")}</strong>\n                  <span>{resultBreakdown || "available to inspect"}</span>\n                </div>\n                <div>\n                  {sortMenu}\n                  {onSearchWeb ? (\n                    <button type="button" onClick={() => onSearchWeb(q)}>Search wider</button>\n                  ) : null}\n                  {hasEvidenceGap ? (\n                    <button type="button" className="rd-v2-discover-strategy-trigger is-ready" onClick={() => setRouteComparisonOpen(true)}>\n                      Compare for open gap\n                    </button>\n                  ) : null}\n                </div>\n              </div>\n\n'''
          s=s[:start]+replacement+s[end:]
          # Remove centre assessment; InspectorRail already owns this authority.
          a=s.index('              {assessmentActive ? (')
          b=s.index('\n\n            </section>', a)
          s=s[:a]+s[b:]
          p.write_text(s)

          css=Path('drive/src/v2/discover-three-zone.css')
          css.write_text(r'''/* Discover wide workstation: left rail = search state, centre = retrieval, right rail = detail/assessment. */
@media (min-width: 1680px) and (min-height: 900px) {
  .rd-v2-discover-page .rd-v2-page-head { padding-bottom: 8px !important; }
  .rd-v2-discover-page .rd-v2-page-head h1 { margin-bottom: 1px !important; }
  .rd-v2-discover-page .rd-v2-page-head p { margin-top: 0 !important; }

  .rd-v2-discover-page .rd-v2-discover-explore-workspace {
    margin-bottom: 4px !important;
    padding-bottom: 0 !important;
  }
  .rd-v2-discover-page .rd-v2-discover-explore-need { margin-bottom: 5px !important; }
  .rd-v2-discover-page .rd-v2-discover-composer { min-height: 66px !important; padding-block: 8px !important; }
  .rd-v2-discover-page .rd-v2-discover-composer > p,
  .rd-v2-discover-page .rd-v2-discover-composer-scope { display: none !important; }

  .rd-v2-discover-centre-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    min-height: 38px;
    margin: 0 0 3px;
    padding: 5px 2px 6px;
    border-bottom: 1px solid color-mix(in srgb, var(--rd-border, #d9d2c3) 72%, transparent);
  }
  .rd-v2-discover-centre-toolbar > div { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .rd-v2-discover-centre-toolbar > div:first-child strong { font-size: 12.5px; color: #24313b; }
  .rd-v2-discover-centre-toolbar > div:first-child span { overflow: hidden; color: #6a716f; font-size: 10.5px; text-overflow: ellipsis; white-space: nowrap; }
  .rd-v2-discover-centre-toolbar > div:last-child { justify-content: flex-end; flex: 0 0 auto; }
  .rd-v2-discover-centre-toolbar button,
  .rd-v2-discover-centre-toolbar summary { min-height: 29px !important; font-size: 10px !important; }

  .rd-v2-discover-page .rd-v2-discover-ranked-results { margin-top: 0 !important; }
  .rd-v2-discover-page .rd-v2-discover-ranked-results-head {
    min-height: 28px !important;
    padding-block: 5px !important;
  }

  /* The left cockpit should spend its lower half on live state instead of leaving a blank sub-rail. */
  .rd-v2-discover-evidence-cockpit {
    align-self: start;
    min-height: calc(100vh - 128px);
  }
  .rd-v2-discover-evidence-cockpit .rd-v2-cockpit-network,
  .rd-v2-discover-evidence-cockpit .rd-v2-cockpit-assessment,
  .rd-v2-discover-evidence-cockpit .rd-v2-cockpit-execution { display: block !important; }

  /* Rich enough to evaluate, compact enough to compare three records before scrolling. */
  .rd-v2-discover-page:has(.rd-v2-discover-field--utility) .rd-v2-discover-ranked-results .rd-v2-discover-candidate {
    min-height: 144px !important;
    padding-top: 11px !important;
    padding-bottom: 11px !important;
  }
  .rd-v2-discover-page:has(.rd-v2-discover-field--utility) .rd-v2-discover-ranked-results .rd-v2-discover-candidate-main { gap: 5px !important; }
  .rd-v2-discover-page:has(.rd-v2-discover-field--utility) .rd-v2-discover-ranked-results .rd-v2-discover-evidence {
    font-size: 12.75px !important;
    line-height: 1.35 !important;
  }
  .rd-v2-discover-page:has(.rd-v2-discover-field--utility) .rd-v2-discover-ranked-results .rd-v2-dataset-profile {
    gap: 4px !important;
    padding: 7px 10px 6px !important;
  }
  .rd-v2-discover-page:has(.rd-v2-discover-field--utility) .rd-v2-dataset-profile-body { gap: 18px !important; }
  .rd-v2-discover-page:has(.rd-v2-discover-field--utility) .rd-v2-dataset-profile-contents > strong { font-size: 12.75px !important; }
  .rd-v2-discover-page:has(.rd-v2-discover-field--utility) .rd-v2-dataset-profile-contents > span,
  .rd-v2-discover-page:has(.rd-v2-discover-field--utility) .rd-v2-dataset-profile-coverage,
  .rd-v2-discover-page:has(.rd-v2-discover-field--utility) .rd-v2-dataset-profile-open { font-size: 10px !important; }
  .rd-v2-discover-page:has(.rd-v2-discover-field--utility) .rd-v2-dataset-profile-metric > em { font-size: 10.75px !important; }
}
''')

          # Import final authority CSS from the analytical component.
          c=Path('drive/src/v2/DiscoverDatasetProfile.jsx')
          t=c.read_text()
          imp='import "./discover-analytical-record.css";\n'
          if 'discover-three-zone.css' not in t:
              t=t.replace(imp, imp+'import "./discover-three-zone.css";\n',1)
          c.write_text(t)
          PY
          git config user.name research-drive-bot
          git config user.email actions@users.noreply.github.com
          git add drive/src/v2/BrowsePage.jsx drive/src/v2/DiscoverDatasetProfile.jsx drive/src/v2/discover-three-zone.css
          git commit -m "prototype(discover): make centre retrieval-first"
          git push origin HEAD:prototype/discover-utility-workbench-20260902
