name: Synthesis convergence render

on:
  push:
    branches:
      - work/chatgpt-final-convergence-20260825
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate draft helper import
        shell: bash
        run: |
          git fetch origin work/chatgpt-final-convergence-20260825:refs/remotes/origin/work/chatgpt-final-convergence-20260825
          git checkout -B synthesis-draft-import-fix origin/work/chatgpt-final-convergence-20260825
          python - <<'PY'
          from pathlib import Path
          path = Path("drive/src/v2/SynthesisPage.jsx")
          text = path.read_text(encoding="utf-8")
          line = 'import { synthesisDraftBrief, synthesisDraftPrompt } from "@/v2/synthesisDraft.js";\n'
          doubled = line + line
          if doubled in text:
              text = text.replace(doubled, line, 1)
          elif text.count(line) != 1:
              raise SystemExit(f"unexpected draft helper import count: {text.count(line)}")
          path.write_text(text, encoding="utf-8")
          PY
          if ! git diff --quiet -- drive/src/v2/SynthesisPage.jsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add drive/src/v2/SynthesisPage.jsx
            git commit -m "fix(synthesis): dedupe draft helper import"
            git push origin HEAD:work/chatgpt-final-convergence-20260825
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run build
      - name: Render converged Synthesis frames
        run: mkdir -p .tmp-pw artifacts/synthesis-convergence && TMPDIR=$PWD/.tmp-pw CI=true YZU_PAGES=false npx playwright test e2e/synthesis-convergence-render.spec.js --reporter=line
      - name: Render desktop Synthesis workflow states
        run: >-
          mkdir -p artifacts/synthesis-acceptance &&
          TMPDIR=$PWD/.tmp-pw CI=true YZU_PAGES=false npx playwright test e2e/synthesis-acceptance-screenshots.spec.js
          --grep " at desktop 1440px"
          --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthesis-convergence-pngs
          path: |
            artifacts/synthesis-convergence
            artifacts/synthesis-acceptance
            test-results
          if-no-files-found: warn
