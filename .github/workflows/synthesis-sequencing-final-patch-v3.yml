name: Synthesis final reasoning sequencing patch v3

on:
  push:
    branches:
      - hardening/synthesis-analytical-verification-20260826
    paths:
      - .github/workflows/synthesis-sequencing-final-patch-v3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/synthesis-analytical-verification-20260826
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply guarded sequencing fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one literal match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          def sub_once(path, pattern, replacement, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              new_text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one regex match, found {count}')
              p.write_text(new_text, encoding='utf-8')

          page = 'drive/src/v2/SynthesisPage.jsx'
          home = 'drive/src/v2/SynthesisHome.jsx'
          test = 'e2e/v2-synthesis.spec.js'

          replace_once(page, '    if (!nextObjective || !reasoningAvailable) return;', '    if (!nextObjective) return;', 'create thread assistant guard')
          sub_once(page, r'\n      setReasoningThreadId\(created\.id\);\n      ask\(\n        `Interpret this research objective\.[\s\S]*?\n      \);', '', 'create thread hidden reasoning')
          replace_once(page, '    if (!profile?.id || !reasoningAvailable) return;', '    if (!profile?.id) return;', 'blueprint assistant guard')
          sub_once(page, r'\n      setReasoningThreadId\(created\.id\);\n      ask\(\n        `Use registered blueprint \$\{profile\.id\} \(\$\{title\}\)\.[\s\S]*?\n      \);', '', 'blueprint hidden reasoning')

          sub_once(page, r'<p className="s04-new-entry-boundary">\s*Nothing is built here\. \{reasoningAvailable[\s\S]*?</p>', '<p className="s04-new-entry-boundary">\n            Nothing is built here. After creation, the desk reviews held Library evidence; Ask reasoning remains a separate step and waits if the assistant is unavailable.\n          </p>', 'new entry boundary')
          sub_once(page, r'\{objective\.trim\(\)\s*\? reasoningAvailable\s*\? "Creates one durable Synthesis thread from this exact purpose\."\s*: "Assistant reasoning must be verified before this entry can create a thread\."\s*: "Enter a purpose to create a durable thread\."\}', '{objective.trim()\n                ? "Creates one durable Synthesis thread from this exact purpose."\n                : "Enter a purpose to create a durable thread."}', 'new entry footer')
          replace_once(page, 'disabled={busy || !objective.trim() || !reasoningAvailable}', 'disabled={busy || !objective.trim()}', 'create button disabled')
          replace_once(page, 'title={!reasoningAvailable ? reasoningStatus : objective.trim() ? undefined : "Enter an objective to continue"}', 'title={objective.trim() ? undefined : "Enter an objective to continue"}', 'create button title')
          replace_once(page, '{reasoningAvailable ? "Create construction" : "Assistant unavailable"}', 'Create construction', 'create button label')
          sub_once(page, r'disabled=\{busy \|\| !reasoningAvailable\}\s*\n\s*onClick=\{\(\) => onStartBlueprint\?\.\(profile\)\}\s*\n\s*title=\{!reasoningAvailable \? reasoningStatus : text\(profile\.title, profile\.id\)\}', 'disabled={busy}\n                  onClick={() => onStartBlueprint?.(profile)}\n                  title={text(profile.title, profile.id)}', 'new entry blueprint availability')
          sub_once(page, r'disabled=\{!reasoningAvailable\}\s*\n\s*title=\{!reasoningAvailable \? reasoningStatus : undefined\}\s*\n\s*onClick=\{\(\) => onStartBlueprint\?\.\(profile\)\}', 'onClick={() => onStartBlueprint?.(profile)}\n                  title={text(profile.title, profile.id)}', 'empty workspace blueprint availability')
          sub_once(page, r'<button type="button" className="rd-v2-btn primary" onClick=\{onNew\} disabled=\{!reasoningAvailable\} title=\{!reasoningAvailable \? reasoningStatus : undefined\}>\s*\{reasoningAvailable \? "Start a construction" : "Assistant unavailable"\}\s*</button>', '<button type="button" className="rd-v2-btn primary" onClick={onNew}>\n          Start a construction\n        </button>', 'empty workspace new availability')

          sub_once(home, r'onClick=\{onNew\}\s*\n\s*disabled=\{!reasoningAvailable\}\s*\n\s*title=\{!reasoningAvailable \? reasoningStatus : undefined\}', 'onClick={onNew}', 'home new card availability')
          replace_once(home, '<em>{reasoningAvailable ? "Start →" : "Assistant unavailable"}</em>', '<em>Start →</em>', 'home new card label')
          replace_once(home, '<span><strong>Creation is paused.</strong> {reasoningStatus}. Existing durable work remains inspectable.</span>', '<span><strong>Assistant reasoning is paused.</strong> {reasoningStatus}. You can still create constructions and review or map held evidence.</span>', 'home runtime copy')
          replace_once(home, '<button type="button" className="rd-v2-btn primary" onClick={onNew} disabled={!reasoningAvailable}>Start the first construction</button>', '<button type="button" className="rd-v2-btn primary" onClick={onNew}>Start the first construction</button>', 'home first construction availability')
          sub_once(home, r'onClick=\{\(\) => onStartBlueprint\?\.\(profile\)\}\s*\n\s*disabled=\{!reasoningAvailable\}\s*\n\s*title=\{!reasoningAvailable \? reasoningStatus : text\(profile\.title, profile\.id\)\}', 'onClick={() => onStartBlueprint?.(profile)}\n                title={text(profile.title, profile.id)}', 'home blueprint availability')

          p = Path(test)
          text = p.read_text(encoding='utf-8')
          start_marker = '  test("researcher reviews held evidence before it becomes a durable map input"'
          end_marker = '  test("accepts a revision-bound proposal, then requests but does not fabricate execution"'
          start = text.find(start_marker)
          end = text.find(end_marker, start + 1)
          if start < 0 or end < 0:
              raise SystemExit('held-evidence test block markers not found')
          region = text[start:end]
          disabled_line = '    await expect(next.getByRole("button", { name: "Start method reasoning" })).toBeDisabled();'
          enabled_block = '    await expect(next.getByRole("button", { name: "Start method reasoning" })).toBeEnabled();\n    await capture(page, "02c-held-evidence-mapped-desktop");'
          if region.count(disabled_line) != 1:
              raise SystemExit(f'held-evidence disabled assertion count {region.count(disabled_line)}')
          if region.count(enabled_block) != 1:
              raise SystemExit(f'held-evidence enabled assertion count {region.count(enabled_block)}')
          region = region.replace(disabled_line, disabled_line + '\n    await expect(page.getByTestId("synthesis-draft-state")).toHaveCount(0);\n    await expect(page.getByText("Grounded answer", { exact: true })).toHaveCount(0);', 1)
          region = region.replace(enabled_block, '    await expect(next.getByRole("button", { name: "Start method reasoning" })).toBeEnabled();\n    await expect(page.getByTestId("synthesis-draft-state")).toHaveCount(0);\n    await expect(page.getByText("Grounded answer", { exact: true })).toHaveCount(0);\n    await capture(page, "02c-held-evidence-mapped-desktop");', 1)
          p.write_text(text[:start] + region + text[end:], encoding='utf-8')
          PY

          git diff --check
          git diff -- drive/src/v2/SynthesisPage.jsx drive/src/v2/SynthesisHome.jsx e2e/v2-synthesis.spec.js
          git config user.name 'synthesis-sequencing-bot'
          git config user.email 'synthesis-sequencing-bot@users.noreply.github.com'
          git rm .github/workflows/synthesis-sequencing-final-patch.yml .github/workflows/synthesis-sequencing-final-patch-v2.yml .github/workflows/synthesis-sequencing-final-patch-v3.yml
          git add drive/src/v2/SynthesisPage.jsx drive/src/v2/SynthesisHome.jsx e2e/v2-synthesis.spec.js
          git commit -m 'fix(synthesis): separate evidence setup from assistant reasoning'
          git push origin HEAD:hardening/synthesis-analytical-verification-20260826
