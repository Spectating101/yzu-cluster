name: Library final freeze 2026-09-04

on:
  push:
    branches:
      - audit/library-final-freeze-20260904
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Apply final Library rail composition
        run: |
          python3 scripts/_apply_library_final_freeze.py
          if ! git diff --quiet -- drive/src/v2/library-live-scale.css; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add drive/src/v2/library-live-scale.css
            git commit -m "polish(library): compact final decision rail"
            git push origin HEAD:audit/library-final-freeze-20260904
          fi
      - run: npm ci
      - run: npx playwright install chromium
      - name: Holdings and freshness truth tests
        run: node --test drive/src/v2/libraryHoldings.test.js drive/src/v2/libraryFreshness.test.js
      - name: Production build
        run: npm run build
        env:
          YZU_PAGES: "true"
      - name: Library interaction contracts
        run: mkdir -p .tmp-pw && TMPDIR=$PWD/.tmp-pw npx playwright test e2e/v2-library.spec.js e2e/library-pagination-continuity.spec.js e2e/v2-preview.spec.js e2e/library-holdings.spec.js e2e/library-freshness.spec.js e2e/library-folder-workflow.spec.js --reporter=dot
        env:
          CI: "true"
          YZU_PAGES: "false"
      - name: Complete Library visual state matrix
        run: mkdir -p .tmp-pw && TMPDIR=$PWD/.tmp-pw npx playwright test e2e/library-convergence-render.spec.js e2e/library-preview-closure-render.spec.js e2e/library-visual-depth-render.spec.js e2e/library-folder-workflow.spec.js e2e/library-freshness.spec.js e2e/library-holdings.spec.js --reporter=dot
        env:
          CI: "true"
          YZU_PAGES: "false"
      - name: Upload final Library renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-final-freeze-20260904
          path: |
            artifacts/library-renders
            artifacts/library-folder-workflow
            artifacts/library-freshness
            artifacts/library-holdings
            test-results
          if-no-files-found: warn
          retention-days: 14
