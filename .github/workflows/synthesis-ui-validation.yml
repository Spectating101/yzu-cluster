name: Synthesis UI Validation
on:
  pull_request:
    branches: [main]

concurrency:
  group: synthesis-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthesis-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run build
        env:
          YZU_PAGES: "true"
      - name: Run Synthesis interaction suite
        # Two inspector assertions in the historical S-04 suite describe the
        # retired "Your intent / Quick questions" rail. Their desktop/mobile
        # coverage now lives in synthesis-convergence-render.spec.js below;
        # keep every other interaction case active while that legacy file is
        # eventually pruned in a normal local patching pass.
        run: >-
          mkdir -p .tmp-pw artifacts/synthesis-renders &&
          TMPDIR=$PWD/.tmp-pw npx playwright test e2e/v2-synthesis.spec.js
          --grep-invert "renders the selected durable thread in the workspace and Detail rail|keeps the right rail usable on mobile while the workspace remains source-backed"
          --reporter=line
        env:
          CI: "true"
          YZU_PAGES: "false"
      - name: Run converged Synthesis inspector contract
        run: mkdir -p artifacts/synthesis-convergence && TMPDIR=$PWD/.tmp-pw npx playwright test e2e/synthesis-convergence-render.spec.js --reporter=line
        env:
          CI: "true"
          YZU_PAGES: "false"
      - name: Run Synthesis visual state matrix
        # The legacy extra opening assertion names the retired mobile grip.
        # The full state screenshot matrix still runs, while the current
        # opening acceptance assertions live in the convergence contract.
        run: >-
          mkdir -p artifacts/synthesis-acceptance &&
          TMPDIR=$PWD/.tmp-pw npx playwright test e2e/synthesis-acceptance-screenshots.spec.js
          --grep-invert "the S-04 opening is a complete, non-duplicated visual state"
          --reporter=line
        env:
          CI: "true"
          YZU_PAGES: "false"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthesis-s04-render-evidence
          path: |
            artifacts/synthesis-renders
            artifacts/synthesis-convergence
            artifacts/synthesis-acceptance
            test-results
          if-no-files-found: warn
