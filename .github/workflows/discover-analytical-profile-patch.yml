name: Discover analytical profile patch

on:
  push:
    branches:
      - prototype/discover-utility-workbench-20260902
    paths:
      - .github/workflows/discover-analytical-profile-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/discover-utility-workbench-20260902
          fetch-depth: 0
      - name: Patch analytical dataset result records
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('drive/src/v2/BrowsePage.jsx')
          s = p.read_text()
          imp = 'import { buildDiscoverDataPassport } from "@/v2/discoverDataPassport";\n'
          add = imp + 'import { DiscoverDatasetProfile } from "@/v2/DiscoverDatasetProfile";\n'
          if 'DiscoverDatasetProfile' not in s:
              assert imp in s
              s = s.replace(imp, add, 1)

          start = '          <span\n            className="rd-v2-discover-passport"'
          end = '          <span className="rd-v2-discover-offering-facts" aria-label="Offering facts">'
          if '<DiscoverDatasetProfile row={row} passport={passport} />' not in s:
              a = s.index(start)
              b = s.index(end, a)
              s = s[:a] + '          <DiscoverDatasetProfile row={row} passport={passport} />\n' + s[b:]
          p.write_text(s)

          spec = Path('e2e/discover-reconvergence-visual.spec.js')
          t = spec.read_text()
          old = '''          format: "Parquet",\n          files: ["Parquet data", "_manifest.json", "_schema.json"],\n          size_label: "15.1 MB",\n          license: "CC BY 4.0",\n          preview_supported: true,\n          query_relevance: 4,'''
          new = '''          format: "Parquet",\n          files: ["flows/date=YYYY-MM-DD/part-0000.parquet", "_manifest.json", "_schema.json"],\n          size_label: "30.3 MB",\n          row_count: 278922,\n          column_count: 16,\n          columns: ["amount", "block_time", "flow_type", "stablecoin", "from_address", "to_address", "tx_hash"],\n          temporal_coverage: "2026-05-09 – 2026-08-28",\n          geographic_coverage: "Ethereum",\n          license: "CC BY 4.0",\n          preview_supported: true,\n          query_relevance: 4,'''
          assert old in t
          t = t.replace(old, new, 1)

          old_wdi = '''          temporal_coverage: "1960–2025",\n          geographic_coverage: "200+ countries and territories",\n          variables: ["1,500+ development indicators"],\n          format: "CSV · Excel · API",\n          license: "CC BY 4.0",'''
          new_wdi = '''          temporal_coverage: "1960–2025",\n          geographic_coverage: "200+ countries and territories",\n          variables: ["1,500+ development indicators"],\n          format: "CSV · Excel · API",\n          size_label: "CSV 269.7 MB · Excel 77.9 MB",\n          periodicity: "Annual",\n          license: "CC BY 4.0",'''
          assert old_wdi in t
          t = t.replace(old_wdi, new_wdi, 1)
          spec.write_text(t)
          PY
      - name: Commit prototype
        run: |
          git config user.name research-drive-bot
          git config user.email actions@users.noreply.github.com
          git add drive/src/v2/BrowsePage.jsx e2e/discover-reconvergence-visual.spec.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "prototype(discover): render analytical dataset records"
          git push origin HEAD:prototype/discover-utility-workbench-20260902
