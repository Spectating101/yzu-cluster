name: Synthesis six-residue browser cleanup
on:
  push:
    branches:
      - hardening/synthesis-analytical-verification-20260826
    paths:
      - tools/_tmp_synthesis_six_residue_cleanup.py
      - .github/workflows/_tmp-synthesis-six-residue-cleanup.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/_tmp_synthesis_six_residue_cleanup.py
      - run: node --check e2e/v2-synthesis.spec.js
      - name: Commit aligned browser contracts and self-clean
        run: |
          rm tools/_tmp_synthesis_six_residue_cleanup.py
          rm .github/workflows/_tmp-synthesis-six-residue-cleanup.yml
          git config user.name "synthesis-freeze-cleanup-bot"
          git config user.email "synthesis-freeze-cleanup-bot@users.noreply.github.com"
          git add e2e/v2-synthesis.spec.js tools/_tmp_synthesis_six_residue_cleanup.py .github/workflows/_tmp-synthesis-six-residue-cleanup.yml
          git commit -m "test(synthesis): align remaining browser contracts"
          git push origin HEAD:hardening/synthesis-analytical-verification-20260826
