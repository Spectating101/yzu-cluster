name: Discover capability convergence one-shot

on:
  push:
    branches:
      - polish/discover-visual-freeze-20260827

permissions:
  contents: write

jobs:
  converge:
    if: contains(github.event.head_commit.message, '[discover-capability-converge]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/discover-visual-freeze-20260827
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply guarded Discover capability convergence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match in {path}, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Shared decision-relevant capacity projection. This deliberately exposes
          # capability posture, never worker assignment or execution authority.
          capacity_path = Path("drive/src/v2/discoverDecisionCapacity.js")
          capacity_path.write_text('''import { buildCapacityAccessPairs } from "./resourcesCapacity.js";

function text(value) {
  return String(value ?? "").trim();
}

function routeText(routes = []) {
  return routes
    .map((route) => [route?.source_id, route?.label, route?.provider, route?.access_mode, route?.reason].filter(Boolean).join(" "))
    .join(" ")
    .toLowerCase();
}

/**
 * Project Resources telemetry into the few facts that can change a Discover
 * sourcing decision. These rows are capability context only: they never imply
 * that a worker, quota, or storage tier has been assigned to an acquisition.
 */
export function buildDiscoverDecisionCapacity(rollup, health, { routes = [] } = {}) {
  if (!rollup || typeof rollup !== "object") return [];
  const pairs = buildCapacityAccessPairs(rollup, health);
  const meters = new Map(
    pairs.flatMap((pair) => pair.meters || []).map((meter) => [meter.id, meter]),
  );
  const routeBlob = routeText(routes);
  const ids = ["fleet", "vault"];
  const bigquery = meters.get("bigquery");
  if (bigquery && (/bigquery|warehouse|remote table/.test(routeBlob) || !/not configured/i.test(text(bigquery.metric)))) {
    ids.splice(1, 0, "bigquery");
  }
  const cache = meters.get("cache");
  if (cache?.warn) ids.push("cache");

  return ids
    .map((id) => meters.get(id))
    .filter(Boolean)
    .map((meter) => ({
      id: meter.id,
      label: meter.name,
      metric: text(meter.metric) || "Not reported",
      detail: text(meter.available),
      attention: Boolean(meter.warn),
    }));
}
