name: RC88 platform convergence proof

on:
  push:
    branches:
      - "verify/rc88-platform-convergence-20260829"

permissions:
  contents: read

jobs:
  convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Apply candidate convergence repair in disposable checkout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          spec = Path("e2e/v2-platform-convergence.spec.js")
          text = spec.read_text()

          old = 'await expect(page.getByText("Synthesis workspace", { exact: true })).toBeVisible();'
          new = 'await expect(page.getByTestId("synthesis-home-state").getByText("Synthesis workspace", { exact: true })).toBeVisible();'
          if text.count(old) != 2:
              raise SystemExit(f"unexpected Synthesis assertion count: {text.count(old)}")
          text = text.replace(old, new)

          for heading, expected in (("Profile", 2), ("Settings", 2), ("Resources", 1)):
              old = f'await expect(page.getByRole("heading", {{ name: "{heading}", exact: true }})).toBeVisible();'
              new = f'await expect(page.locator("main.yzu-main").getByRole("heading", {{ name: "{heading}", exact: true }})).toBeVisible();'
              if text.count(old) != expected:
                  raise SystemExit(f"unexpected {heading} assertion count: {text.count(old)}")
              text = text.replace(old, new)

          # Preserve an intermediate-width render in the disposable proof.
          text = text.replace(
              'if (viewport.width === 390 || viewport.width === 1920) {',
              'if (viewport.width === 390 || viewport.width === 768 || viewport.width === 1920) {',
          )
          spec.write_text(text)

          css = Path("drive/src/v2/release-scale.css")
          css_text = css.read_text()
          marker = "/* RC88 Library tablet toolbar convergence */"
          if marker in css_text:
              raise SystemExit("candidate tablet rule already present")
          css_text += '''\n\n/* RC88 Library tablet toolbar convergence */
          @media (min-width: 721px) and (max-width: 820px) {
            .rd-v2-library-toolbar-filters {
              flex: 1 1 100%;
              min-width: 0;
              max-width: 100%;
              flex-wrap: wrap;
            }
          }
          '''
          css.write_text(css_text)
          PY
          git diff --check
          git diff -- e2e/v2-platform-convergence.spec.js drive/src/v2/release-scale.css

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx playwright install chromium --with-deps

      - name: Verify all integrated convergence contracts
        run: >-
          mkdir -p .tmp-pw artifacts/platform-convergence &&
          TMPDIR=$PWD/.tmp-pw CI=true YZU_PAGES=false npx playwright test
          e2e/v2-platform-convergence.spec.js --workers=1 --reporter=line

      - name: Preserve convergence renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc88-platform-convergence-candidate
          path: |
            artifacts/platform-convergence
            test-results
          if-no-files-found: warn