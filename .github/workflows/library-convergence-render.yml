name: Library convergence render

on:
  push:
    branches:
      - hardening/library-evidence-rigor-20260827
  workflow_dispatch:

concurrency:
  group: library-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Build Research Drive
        run: npm run build

      - name: Exercise current Library workflow
        run: npx playwright test e2e/v2-library.spec.js --reporter=line
        env:
          CI: "true"
          YZU_PAGES: "false"

      - name: Render Library convergence states
        run: npx playwright test e2e/library-convergence-render.spec.js --reporter=line
        env:
          CI: "true"
          YZU_PAGES: "false"

      - name: Upload Library renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-convergence-renders
          path: |
            artifacts/library-renders
            test-results
          if-no-files-found: warn
          retention-days: 14
