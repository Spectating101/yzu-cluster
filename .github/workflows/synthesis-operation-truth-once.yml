name: Synthesis operation truth one-shot

on:
  push:
    branches:
      - polish/synthesis-wide-workstation-20260902
    paths:
      - .github/workflows/synthesis-operation-truth-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/synthesis-wide-workstation-20260902
          fetch-depth: 0
      - name: Refactor Synthesis to durable journey authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          page_path = Path('drive/src/v2/SynthesisPage.jsx')
          page = page_path.read_text()

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing replacement anchor: {label}')
              return text.replace(old, new, 1)

          page = replace_once(
              page,
              '  synthesisPreviewTruth,\n  synthesisShowsEvidenceMap,\n  synthesisShowsStageStrip,\n',
              '  synthesisPreviewTruth,\n  synthesisJourney,\n  synthesisShowsEvidenceMap,\n  synthesisShowsStageStrip,\n',
              'journey import',
          )

          progress_pattern = re.compile(
              r'const SYNTHESIS_STAGES = \[.*?\n}\n\nfunction SynthesisSidebarPortal',
              re.S,
          )
          progress_replacement = '''function SynthesisProgress({ thread }) {
            const journey = synthesisJourney(thread);
            return (
              <ol className="s04-steps" aria-label="Synthesis journey">
                {journey.stages.map((stage) => (
                  <li
                    key={stage.id}
                    className={stage.state === "done" ? "done" : stage.state === "current" ? "now" : ""}
                  >
                    <span>{stage.state === "done" ? "✓" : stage.index + 1}</span>
                    <b>{stage.label}</b>
                    <small>{stage.detail}</small>
                  </li>
                ))}
              </ol>
            );
          }

          function SynthesisSidebarPortal'''
          page, count = progress_pattern.subn(progress_replacement, page, count=1)
          if count != 1:
              raise SystemExit('failed to replace legacy SynthesisProgress')

          opening_pattern = re.compile(
              r'function OpeningWorkflow\(\{ thread, reasoningAvailable, reasoningStatus \}\) \{.*?\n}\n\nfunction OpeningRoleMap',
              re.S,
          )
          opening_replacement = '''function OpeningWorkflow({
            thread,
            reasoningAvailable,
            reasoningStatus,
            evidenceProposalAvailable = false,
            reasoningPending = false,
          }) {
            const mapped = evidenceNodes(thread).length > 0;
            const recommendation = recommendedConstruction(thread).present;
            const hasProposal = Boolean(thread?.state?.proposal);
            const journey = synthesisJourney(thread);
            const nextOperation = hasProposal
              ? "Review the exact proposal below. Accepting it is the first durable method decision."
              : reasoningPending
                ? "Ask is drafting one reviewable method proposal from the mapped evidence. Nothing is accepted or executed yet."
                : !mapped && evidenceProposalAvailable
                  ? "Review the held inputs below and add only the evidence that belongs to this research object."
                  : recommendation
                    ? "Review the recommendation, then draft one reviewable method proposal before anything is accepted."
                    : mapped
                      ? reasoningAvailable
                        ? "Review mapped evidence, then request one reviewable construction."
                        : `${reasoningStatus}; review the evidence map or check Resources before reasoning.`
                      : reasoningAvailable
                        ? "Find and review held Library evidence before method reasoning."
                        : `Find and review held Library evidence; ${reasoningStatus.toLowerCase()} blocks method reasoning.`;
            return (
              <div className="s04-opening-workflow-wrap">
                <ol className="s04-opening-workflow" aria-label="Synthesis workflow">
                  {journey.stages.map((stage) => (
                    <li
                      key={stage.id}
                      className={stage.state === "done" ? "done" : stage.state === "current" ? "now" : ""}
                    >
                      <span>{stage.state === "done" ? "✓" : stage.index + 1}</span>
                      <div><b>{stage.label}</b><small>{stage.detail}</small></div>
                    </li>
                  ))}
                </ol>
                <p className="s04-opening-workflow-note" data-testid="synthesis-workflow-next">
                  <b>Current operation</b>
                  <span>{nextOperation}</span>
                </p>
              </div>
            );
          }

          function OpeningRoleMap'''
          page, count = opening_pattern.subn(opening_replacement, page, count=1)
          if count != 1:
              raise SystemExit('failed to replace OpeningWorkflow')

          page = replace_once(
              page,
              '  const reasoningBlocked = !hasProposal && !hasRecommendation && !reasoningAvailable;\n  return (',
              '  const reasoningBlocked = !hasProposal && !hasRecommendation && !reasoningAvailable;\n  if (hasProposal || (needsEvidence && evidenceProposalAvailable) || reasoningPending) return null;\n  return (',
              'WhatHappensNext authority',
          )

          page = replace_once(
              page,
              '? "Accepting a construction will not build data. The desk will draft the detailed method and surface only the choices that materially change the output."',
              '? "Drafting a reviewable method proposal will not build data. The proposal remains inspectable and nothing is accepted until you explicitly approve its exact revision."',
              'recommendation consequence',
          )

          page = replace_once(
              page,
              '? "Accept & design method"',
              '? "Draft reviewable method"',
              'recommendation button label',
          )

          page = replace_once(
              page,
              '''                <OpeningWorkflow
                  thread={displayedSelected}
                  reasoningAvailable={reasoningAvailable}
                  reasoningStatus={reasoningStatus}
                />''',
              '''                <OpeningWorkflow
                  thread={displayedSelected}
                  reasoningAvailable={reasoningAvailable}
                  reasoningStatus={reasoningStatus}
                  evidenceProposalAvailable={Boolean(evidenceProposal)}
                  reasoningPending={reasoningPending}
                />''',
              'OpeningWorkflow props',
          )

          measurement_anchor = '''              {mappedInputKey && preAcceptance ? (
                <MeasurementStatus
                  phase={measurementPhaseByThread[selected.id] || "idle"}
                  measurements={selectedMeasurement}
                  onRetry={() => measureThread(selected, mappedInputKey)}
                />
              ) : null}
              {preAcceptance ? ('''
          measurement_replacement = '''              {mappedInputKey && preAcceptance ? (
                <MeasurementStatus
                  phase={measurementPhaseByThread[selected.id] || "idle"}
                  measurements={selectedMeasurement}
                  onRetry={() => measureThread(selected, mappedInputKey)}
                />
              ) : null}
              {reasoningPending && !focus.blocking ? (
                <DraftCanvas thread={selected} onAsk={ask} stalled={interpretingStalled} onRetry={retryInterpreting} />
              ) : null}
              {preAcceptance ? ('''
          page = replace_once(page, measurement_anchor, measurement_replacement, 'reasoning surface placement')

          bottom_draft = '''              {reasoningPending && !focus.blocking ? (
                <DraftCanvas thread={selected} onAsk={ask} stalled={interpretingStalled} onRetry={retryInterpreting} />
              ) : null}
'''
          if page.count(bottom_draft) != 2:
              raise SystemExit(f'expected two DraftCanvas blocks after insertion, found {page.count(bottom_draft)}')
          first = page.find(bottom_draft)
          second = page.find(bottom_draft, first + 1)
          page = page[:second] + page[second + len(bottom_draft):]

          page = replace_once(
              page,
              '                    onAccept={() => ask("Accept the recommended construction and draft the detailed method.")}',
              '                    onAccept={() => ask("Use this recommendation as the basis for one reviewable method proposal. Record the proposal for review; do not accept it, execute it, or alter data.", selected, "Draft a reviewable method proposal")}',
              'recommendation Ask semantics',
          )

          page_path.write_text(page)

          test_path = Path('e2e/v2-synthesis.spec.js')
          tests = test_path.read_text()
          tests = replace_once(
              tests,
              'test("shows the four-step workflow and fails closed when assistant runtime is unverified", async ({ page }) => {',
              'test("shows the durable operation path and fails closed when assistant runtime is unverified", async ({ page }) => {',
              'workflow test name',
          )
          old_assertions = '''    await expect(workflow).toContainText("Define");
    await expect(workflow).toContainText("Map evidence");
    await expect(workflow).toContainText("Reason");
    await expect(workflow).toContainText("Approve");'''
          new_assertions = '''    await expect(workflow).toContainText("Objective");
    await expect(workflow).toContainText("Evidence");
    await expect(workflow).toContainText("Specification");
    await expect(workflow).toContainText("Proposal");
    await expect(workflow).toContainText("Preview");
    await expect(workflow).toContainText("Approval");
    await expect(workflow).toContainText("Build");
    await expect(workflow).toContainText("Result");'''
          tests = replace_once(tests, old_assertions, new_assertions, 'durable journey assertions')
          test_path.write_text(tests)
          PY
      - name: Commit operation truth refactor
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add drive/src/v2/SynthesisPage.jsx e2e/v2-synthesis.spec.js
          git diff --cached --check
          git commit -m "fix(synthesis): bind UI to durable operation journey"
          git push origin HEAD:polish/synthesis-wide-workstation-20260902
