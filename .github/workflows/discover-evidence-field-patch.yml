name: Discover evidence-field integration patch

on:
  push:
    branches:
      - polish/discover-reconvergence-20260902
    paths:
      - "scripts/discover_evidence_field_patch.py"
      - ".github/workflows/discover-evidence-field-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/discover-reconvergence-20260902
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/discover_evidence_field_patch.py
      - name: Commit evidence-field integration
        run: |
          git config user.name "research-drive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add drive/src/v2/BrowsePage.jsx
          git diff --cached --check
          git commit -m "feat(discover): expose large candidate fields and assembly state"
          git push origin HEAD:polish/discover-reconvergence-20260902
