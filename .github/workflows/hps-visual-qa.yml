name: HPS Visual QA

on:
  push:
    branches:
      - hardening/hps-visual-qa-20260827
  workflow_dispatch:

concurrency:
  group: hps-visual-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Production build
        run: npm run build
      - name: Run HPS visual QA
        run: |
          mkdir -p .tmp-pw artifacts/hps-visual
          TMPDIR=$PWD/.tmp-pw CI=true YZU_PAGES=false \
            npx playwright test e2e/hps-visual-qa.spec.js --reporter=line
      - name: Upload HPS renders and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hps-visual-qa
          path: |
            artifacts/hps-visual
            test-results
          if-no-files-found: warn
          retention-days: 7
