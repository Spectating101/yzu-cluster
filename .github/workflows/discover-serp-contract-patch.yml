name: Discover SERP contract patch

on:
  push:
    branches:
      - prototype/discover-utility-workbench-20260902
    paths:
      - ".github/workflows/discover-serp-contract-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/discover-utility-workbench-20260902
      - name: Patch proven Discover visual contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('e2e/discover-reconvergence-visual.spec.js')
          s = p.read_text()

          s = s.replace(
            'await expect(page.getByRole("heading", { name: "Discover" })).toBeVisible();',
            'await expect(page.getByRole("heading", { name: "Discover", exact: true })).toBeVisible();',
            1,
          )

          old = '''      const fieldBox = await page.getByTestId("discover-evidence-field").boundingBox();
      const resultsBox = await page.getByTestId("discover-ranked-results").boundingBox();
      expect(fieldBox).not.toBeNull();
      expect(resultsBox).not.toBeNull();
      expect(resultsBox.y - (fieldBox.y + fieldBox.height)).toBeLessThan(38);'''
          new = '''      const resultsBox = await page.getByTestId("discover-ranked-results").boundingBox();
      expect(resultsBox).not.toBeNull();
      if (viewport.width >= 1680) {
        await expect(page.getByTestId("discover-evidence-field")).toBeHidden();
        await expect(page.getByTestId("discover-interpreting")).toBeVisible();
        await expect(page.locator(".rd-v2-discover-frozen-controls")).toBeVisible();
        const firstResultBox = await page.getByTestId("discover-ranked-results").locator(".rd-v2-discover-candidate").first().boundingBox();
        expect(firstResultBox).not.toBeNull();
        expect(firstResultBox.y).toBeLessThan(430);
      } else {
        const fieldBox = await page.getByTestId("discover-evidence-field").boundingBox();
        expect(fieldBox).not.toBeNull();
        expect(resultsBox.y - (fieldBox.y + fieldBox.height)).toBeLessThan(38);
      }'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''      await page.getByRole("button", { name: /DataCite live catalogue/i }).click();
      await expect(page.getByText(/DataCite live catalogue/i).first()).toBeVisible();'''
          new = '''      const dataciteRow = page.getByTestId("discover-ranked-results").getByRole("button", { name: /DataCite live catalogue/i });
      await dataciteRow.click();
      await expect(dataciteRow).toHaveAttribute("aria-pressed", "true");'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    await expect(page.getByText(/DataCite live catalogue/i).first()).toBeVisible();'''
          new = '''    const dataciteRow = page.getByTestId("discover-ranked-results").getByRole("button", { name: /DataCite live catalogue/i });
    await expect(dataciteRow).toHaveAttribute("aria-pressed", "true");'''
          assert old in s
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit contract update
        run: |
          git config user.name research-drive-bot
          git config user.email actions@users.noreply.github.com
          git add e2e/discover-reconvergence-visual.spec.js
          git commit -m "test(discover): certify SERP workstation allocation"
          git push origin HEAD:prototype/discover-utility-workbench-20260902
