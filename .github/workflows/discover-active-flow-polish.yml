name: Discover active-flow polish

on:
  push:
    branches:
      - polish/discover-reconvergence-20260902
    paths:
      - "scripts/discover_active_flow_polish.py"
      - ".github/workflows/discover-active-flow-polish.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/discover-reconvergence-20260902
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/discover_active_flow_polish.py
      - name: Commit active-flow polish
        run: |
          git config user.name "research-drive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add drive/src/v2/DiscoverEvidenceBrief.jsx drive/src/v2/discover-efficiency-polish.css e2e/discover-reconvergence-visual.spec.js
          git diff --cached --check
          git commit -m "polish(discover): tighten active research flow"
          git push origin HEAD:polish/discover-reconvergence-20260902
