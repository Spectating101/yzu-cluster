name: Discover fresh-navigation repair

on:
  push:
    branches:
      - polish/discover-reconvergence-20260902
    paths:
      - ".github/workflows/discover-fresh-navigation-repair.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/discover-reconvergence-20260902
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/discover_fresh_navigation_repair.py
      - run: |
          git config user.name "research-drive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add drive/src/v2/App.jsx
          git diff --cached --check
          git commit -m "fix(discover): clear stale selection on fresh navigation"
          git push origin HEAD:polish/discover-reconvergence-20260902
