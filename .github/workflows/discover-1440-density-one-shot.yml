name: Discover 1440 density one shot

on:
  push:
    branches:
      - polish/discover-visual-freeze-20260827

permissions:
  contents: write

jobs:
  harden:
    if: contains(github.event.head_commit.message, '[discover-1440-density]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/discover-visual-freeze-20260827
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Apply 1440 density hardening
        run: python .github/scripts/discover_1440_density_harden.py
      - name: Build
        run: npm run build
      - name: Preserve Discover adversarial authority
        run: >-
          mkdir -p .tmp-pw &&
          TMPDIR=$PWD/.tmp-pw CI=true YZU_PAGES=false npx playwright test
          e2e/v2-discover-adversarial.spec.js e2e/v2-discover-authority-depth.spec.js e2e/v2-discover-submit-recovery.spec.js
          --workers=1 --reporter=line
      - name: Render and measure convergence states
        run: >-
          mkdir -p .tmp-pw artifacts/discover-convergence &&
          TMPDIR=$PWD/.tmp-pw CI=true YZU_PAGES=false npx playwright test
          e2e/discover-visual-convergence.spec.js --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discover-1440-density
          path: |
            artifacts/discover-convergence
            test-results
          if-no-files-found: warn
      - name: Commit visual hardening
        run: |
          git config user.name "discover-hardening-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drive/src/v2/discover-visual-freeze.css e2e/discover-visual-convergence.spec.js
          git diff --cached --check
          git commit -m "polish(discover): restore 1440 investigation legibility"
          git push origin HEAD:polish/discover-visual-freeze-20260827
