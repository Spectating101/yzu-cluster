name: HPS Functional Closure Apply

on:
  push:
    branches:
      - hardening/hps-shell-convergence-20260827
    paths:
      - .github/workflows/hps-apply-functional.yml

permissions:
  contents: write

jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/hps-shell-convergence-20260827
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Decode and check functional patch
        run: |
          base64 -d .github/hps-functional.patch.gz.b64 | gzip -dc > /tmp/hps-functional.patch
          git apply --check /tmp/hps-functional.patch
          git apply /tmp/hps-functional.patch
      - name: Install dependencies
        run: npm ci
      - name: Home continuity unit contracts
        run: node --test drive/src/v2/homeIteration10.test.js
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Cross-surface HPS workflows
        run: |
          mkdir -p .tmp-pw
          TMPDIR=$PWD/.tmp-pw CI=true YZU_PAGES=false \
            npx playwright test \
              e2e/hps-purpose-closure.spec.js \
              e2e/v2-home.spec.js \
              e2e/v2-profile-freeze.spec.js \
              e2e/hps-inner-containment.spec.js \
              --reporter=line
      - name: Commit verified functional closure
        run: |
          rm -f .github/hps-functional.patch.gz.b64 .github/workflows/hps-apply-functional.yml
          git config user.name "hps-closure-bot"
          git config user.email "hps-closure-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat(hps): close cross-surface purpose loops"
          git push origin HEAD:hardening/hps-shell-convergence-20260827
