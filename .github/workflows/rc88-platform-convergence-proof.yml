name: RC88 stage proven convergence repair

on:
  push:
    branches:
      - "verify/rc88-platform-convergence-20260829"

permissions:
  contents: write

jobs:
  stage-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout disposable proof branch
        uses: actions/checkout@v4
        with:
          ref: verify/rc88-platform-convergence-20260829
          fetch-depth: 0

      - name: Apply proven convergence repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          spec = Path("e2e/v2-platform-convergence.spec.js")
          text = spec.read_text()

          old = 'await expect(page.getByText("Synthesis workspace", { exact: true })).toBeVisible();'
          new = 'await expect(page.getByTestId("synthesis-home-state").getByText("Synthesis workspace", { exact: true })).toBeVisible();'
          if text.count(old) != 2:
              raise SystemExit(f"unexpected Synthesis assertion count: {text.count(old)}")
          text = text.replace(old, new)

          for heading, expected in (("Profile", 2), ("Settings", 2), ("Resources", 1)):
              old = f'await expect(page.getByRole("heading", {{ name: "{heading}", exact: true }})).toBeVisible();'
              new = f'await expect(page.locator("main.yzu-main").getByRole("heading", {{ name: "{heading}", exact: true }})).toBeVisible();'
              if text.count(old) != expected:
                  raise SystemExit(f"unexpected {heading} assertion count: {text.count(old)}")
              text = text.replace(old, new)

          spec.write_text(text)

          css = Path("drive/src/v2/release-scale.css")
          css_text = css.read_text()
          marker = "/* Library filters must wrap before the phone layout takes authority. */"
          if marker in css_text:
              raise SystemExit("tablet Library convergence rule already present")
          css_text += '''\n\n/* Library filters must wrap before the phone layout takes authority. */
          @media (min-width: 721px) and (max-width: 820px) {
            .rd-v2-library-toolbar-filters {
              flex: 1 1 100%;
              min-width: 0;
              max-width: 100%;
              flex-wrap: wrap;
            }
          }
          '''
          css.write_text(css_text)
          PY

          git diff --check
          test "$(git diff --name-only | sort)" = "drive/src/v2/release-scale.css
          e2e/v2-platform-convergence.spec.js"
          git diff -- drive/src/v2/release-scale.css e2e/v2-platform-convergence.spec.js

      - name: Commit proof tree without workflow scaffolding
        shell: bash
        run: |
          rm .github/workflows/rc88-platform-convergence-proof.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drive/src/v2/release-scale.css e2e/v2-platform-convergence.spec.js .github/workflows/rc88-platform-convergence-proof.yml
          git diff --cached --check
          git commit -m "fix(rc): close integrated platform convergence"
          git push origin HEAD:verify/rc88-platform-convergence-20260829