name: Discover adversarial hardening one shot

on:
  push:
    branches:
      - polish/discover-visual-freeze-20260827

permissions:
  contents: write

jobs:
  harden:
    if: contains(github.event.head_commit.message, '[discover-adversarial-harden]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/discover-visual-freeze-20260827
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply race and idempotency hardening
        run: python3 .github/scripts/discover_adversarial_hardening.py
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: Unit and production build
        run: |
          npm run test:candidate-key
          npm run build
      - name: Preserve established Discover behavior
        run: >-
          mkdir -p .tmp-pw &&
          TMPDIR=$PWD/.tmp-pw CI=true YZU_PAGES=false npx playwright test
          e2e/v2-discover.spec.js --reporter=line
          --grep-invert "Search wider retains held evidence and trusts the federator's semantic relevance|mobile selection preserves Explore and opens Ask deliberately"
      - name: Preserve evidence investigation
        run: >-
          mkdir -p .tmp-pw &&
          TMPDIR=$PWD/.tmp-pw CI=true YZU_PAGES=false npx playwright test
          e2e/v2-discover-evidence.spec.js --reporter=line
      - name: Prove adversarial lifecycle races are fenced
        run: >-
          mkdir -p .tmp-pw &&
          TMPDIR=$PWD/.tmp-pw CI=true YZU_PAGES=false npx playwright test
          e2e/v2-discover-adversarial.spec.js --workers=1 --reporter=line
      - name: Preserve rendered convergence states
        run: >-
          mkdir -p .tmp-pw artifacts/discover-convergence &&
          TMPDIR=$PWD/.tmp-pw CI=true YZU_PAGES=false npx playwright test
          e2e/discover-visual-convergence.spec.js --reporter=line
      - name: Commit hardened product code
        run: |
          git config user.name "discover-hardening-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drive/src/v2/DiscoverEvidenceBrief.jsx \
                  drive/src/v2/DiscoverIntentWorkspace.jsx
          git commit -m "hardening(discover): fence stale routes and duplicate submits"
          git push origin HEAD:polish/discover-visual-freeze-20260827
