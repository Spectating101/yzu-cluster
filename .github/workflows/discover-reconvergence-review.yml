name: Discover reconvergence review

on:
  push:
    branches:
      - polish/discover-reconvergence-20260902
      - prototype/discover-utility-workbench-20260902
    paths:
      - "drive/src/v2/**"
      - "e2e/discover-reconvergence-visual.spec.js"
      - ".github/workflows/discover-reconvergence-review.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discover-reconvergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Build and capture Discover
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run build
      - name: Capture reconverged Discover states
        run: >-
          mkdir -p .tmp-pw artifacts/discover-reconvergence &&
          TMPDIR=$PWD/.tmp-pw CI=true YZU_PAGES=false npx playwright test
          e2e/discover-reconvergence-visual.spec.js --workers=1 --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discover-reconvergence-screenshots
          path: |
            artifacts/discover-reconvergence
            test-results
          if-no-files-found: warn
          retention-days: 14

# Prototype replay: approved Research Drive shell with utility-workbench evidence layer.
