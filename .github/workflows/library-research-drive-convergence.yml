name: Library research-drive convergence

on:
  push:
    branches:
      - polish/library-research-drive-convergence-20260903
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: library-research-drive-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded contract migrations
        run: |
          python - <<'PY'
          from pathlib import Path

          preview = Path('drive/src/v2/PreviewModal.jsx')
          text = preview.read_text()
          old = 'rows.slice(0, 12).map((row, rowIndex) => ('
          new = 'rows.slice(0, libraryExpandedSample ? MAX_PREVIEW_ROWS : 12).map((row, rowIndex) => ('
          if old not in text and new not in text:
              raise SystemExit('Preview row bound anchor missing')
          text = text.replace(old, new, 1)
          old = '${Math.min(rows.length, 12)} displayed'
          new = '${Math.min(rows.length, libraryExpandedSample ? MAX_PREVIEW_ROWS : 12)} displayed'
          if old not in text and new not in text:
              raise SystemExit('Preview footer bound anchor missing')
          text = text.replace(old, new, 1)
          preview.write_text(text)

          library = Path('e2e/v2-library.spec.js')
          text = library.read_text()
          replacements = [
              ('estate.getByText("Collections", { exact: true })', 'estate.getByText("Research collections", { exact: true })'),
              ('toContainText("Observed table")', 'toContainText("Observed sample")'),
              ('getByRole("button", { name: "Full preview" })', 'getByRole("button", { name: "Expand sample" })'),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new)
              elif new not in text:
                  raise SystemExit(f'Library contract anchor missing: {old}')

          send = 'getByRole("button", { name: "Send to Ask" })'
          if send in text:
              count = text.count(send)
              if count != 4:
                  raise SystemExit(f'Expected four Library intake Send to Ask assertions/actions, found {count}')
              text = text.replace(send, 'getByRole("button", { name: "Prepare upload" })', 2)
              text = text.replace(send, 'getByRole("button", { name: "Inspect source" })', 2)
          elif 'getByRole("button", { name: "Prepare upload" })' not in text or 'getByRole("button", { name: "Inspect source" })' not in text:
              raise SystemExit('Library intake migration anchors missing')
          library.write_text(text)

          render = Path('e2e/library-convergence-render.spec.js')
          text = render.read_text()
          if 'Observed table' in text:
              text = text.replace('Observed table', 'Observed sample')
          elif 'Observed sample' not in text:
              raise SystemExit('Library convergence render heading anchor missing')
          render.write_text(text)
          PY

      - name: Guard stale Library workflow language
        run: |
          ! grep -n 'Full preview' e2e/v2-library.spec.js e2e/v2-preview.spec.js e2e/library-preview-closure-render.spec.js
          ! grep -n 'Observed table' e2e/v2-library.spec.js e2e/library-convergence-render.spec.js
          ! grep -n 'Send to Ask' e2e/v2-library.spec.js

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Production build
        run: npm run build
        env:
          YZU_PAGES: "true"

      - name: Library interaction contracts
        run: >-
          mkdir -p .tmp-pw && TMPDIR=$PWD/.tmp-pw npx playwright test
          e2e/v2-library.spec.js
          e2e/library-pagination-continuity.spec.js
          e2e/v2-preview.spec.js
          --reporter=dot
        env: &mock-env
          CI: "true"
          YZU_PAGES: "false"

      - name: Library visual contracts
        run: >-
          TMPDIR=$PWD/.tmp-pw npx playwright test
          e2e/library-convergence-render.spec.js
          e2e/library-visual-depth-render.spec.js
          e2e/library-preview-closure-render.spec.js
          --reporter=dot
        env: *mock-env

      - name: Cross-page release visual guard
        run: >-
          TMPDIR=$PWD/.tmp-pw npx playwright test
          e2e/release-visual-convergence.spec.js
          --reporter=dot
        env: *mock-env

      - name: Commit validated contract migrations
        run: |
          if git diff --quiet; then
            echo "No migration delta to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drive/src/v2/PreviewModal.jsx e2e/v2-library.spec.js e2e/library-convergence-render.spec.js
          git commit -m "test(library): align convergence contracts"
          git push origin HEAD:polish/library-research-drive-convergence-20260903

      - name: Upload Library convergence renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-research-drive-convergence-renders
          path: |
            artifacts/library-renders
            artifacts/release-visual
            test-results
          if-no-files-found: warn
          retention-days: 14
