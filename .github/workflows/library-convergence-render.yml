name: Library convergence render

on:
  push:
    branches:
      - hardening/library-evidence-rigor-20260827
      - hardening/library-retrieval-excellence-20260828
  workflow_dispatch:

concurrency:
  group: library-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Library evidence and retrieval truth contracts
        run: >-
          node --test
          drive/src/v2/libraryVerification.test.js
          drive/src/v2/libraryReadinessOwnership.test.js
          drive/src/v2/datasetMeta.test.js
          drive/src/v2/LibraryDatasetRailPanel.test.js
          drive/src/v2/librarySearch.test.js

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Build Research Drive
        run: npm run build

      - name: Exercise current Library workflow and retrieval behavior
        run: >-
          npx playwright test
          e2e/v2-library.spec.js
          e2e/v2-preview.spec.js
          e2e/library-pagination-continuity.spec.js
          e2e/library-retrieval-excellence-render.spec.js
          --reporter=line
        env:
          CI: "true"
          YZU_PAGES: "false"

      - name: Render Library convergence and depth states
        run: >-
          npx playwright test
          e2e/library-convergence-render.spec.js
          e2e/library-visual-depth-render.spec.js
          e2e/library-preview-closure-render.spec.js
          --reporter=line
        env:
          CI: "true"
          YZU_PAGES: "false"

      - name: Upload Library renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-convergence-renders
          path: |
            artifacts/library-renders
            test-results
          if-no-files-found: warn
          retention-days: 14
