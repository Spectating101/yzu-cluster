name: Library final state audit

on:
  push:
    branches:
      - audit/research-drive-final-system-20260903
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: library-final-state-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard Library semantic ownership
        run: |
          grep -n 'Holdings' drive/src/v2/LibraryAssetWorkspace.jsx
          grep -n 'library-rail-holdings' drive/src/v2/LibraryDatasetRailPanel.jsx
          ! grep -n 'library-holding-filter' drive/src/v2/LibraryPage.jsx
          ! grep -n 'key: "holding"' drive/src/v2/librarySearch.js
          ! grep -n 'Bibliographic and holding metadata' drive/src/v2/LibraryAssetWorkspace.jsx
          ! grep -n '<dt>Vault path</dt>' drive/src/v2/LibraryAssetWorkspace.jsx

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Holdings truth unit tests
        run: node --test drive/src/v2/libraryHoldings.test.js

      - name: Production build
        run: npm run build
        env:
          YZU_PAGES: "true"

      - name: Library interaction contracts
        run: >-
          mkdir -p .tmp-pw && TMPDIR=$PWD/.tmp-pw npx playwright test
          e2e/v2-library.spec.js
          e2e/library-pagination-continuity.spec.js
          e2e/v2-preview.spec.js
          e2e/library-holdings.spec.js
          --reporter=dot
        env: &mock-env
          CI: "true"
          YZU_PAGES: "false"

      - name: Complete Library visual state matrix
        run: >-
          TMPDIR=$PWD/.tmp-pw npx playwright test
          e2e/library-convergence-render.spec.js
          e2e/library-preview-closure-render.spec.js
          e2e/library-visual-depth-render.spec.js
          --reporter=dot
        env: *mock-env

      - name: Upload Library audit renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-final-state-audit
          path: |
            artifacts/library-holdings
            artifacts/library-renders
            test-results
          if-no-files-found: warn
          retention-days: 14
